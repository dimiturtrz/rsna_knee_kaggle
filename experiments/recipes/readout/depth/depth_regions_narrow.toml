# The same region pooling as `depth_regions`, on the band every OTHER member reads: 0.20-0.80 at 12
# slices. It is the transfer question, and it is only worth a slot if `depth_regions` moves.
#
# 2026-08-19, AFTER depth_regions RAN. Its MEAN did not move — 0.8549 against band_dense's 0.8578,
# -0.0029, under the 0.0062 floor — but the mean is not what this arm was written to read. Per label,
# depth_regions has exactly two moves that clear their own interval, and they say opposite things:
# PF OA -0.0193*, which is band_wide's -0.0194* to the fourth decimal, and Lateral Meniscus +0.0165*,
# where band_wide managed +0.0007. Read together: the WIDE BAND costs the patellofemoral centre
# whatever the pooling does, and region pooling buys a mid-band focal structure the whole-band amax was
# losing. The written prediction — centre holds AND periphery recovers — is wrong on both clauses
# (MCL +0.0031 against band_wide's +0.0111 is not a recovery), so this is not a confirmation; it is a
# different, unpredicted signature that the mean averaged away.
#
# So the premise stands on the per-label read rather than the mean one, and this arm becomes the
# single-variable question that separates the two effects: on a 0.20-0.80 band there is no
# patellofemoral loss to pay, so if the lateral-meniscus gain is REGION POOLING it survives here and
# lands net-positive; if it was the wide band's extra depth it does not appear at all. Thirteen labels
# and two stars is also a multiple-comparison risk, which is the second reason to run it — a
# signature that reproduces on a different band is not the same claim as one that starred once.
#
# WHAT IT ASKS. `depth_regions` puts region pooling and a wide dense band together, so a gain there is
# attributable to either. This arm holds the reading at the pool's own — 336 px, 12 slices, 0.20-0.80,
# backbone rate 4e-5 — and changes nothing but the aggregation. Against `lr4e-5_ws_s2026` at 0.8525 it
# is a single-variable test of whether one maximum per depth region beats one over the whole band when
# the band is NOT wide. If it does, the pooled-budget argument is about depth generally rather than
# about the outer tenth band_wide added.
#
# WHY IT IS THE CHEAPEST MEMBER WE CAN ADD. It reads the standard cache, so its `pixel_group` is
# `lr4e-5_ws`'s exactly — 336 px, 12 slices, 0.20-0.80, same crop, same tie, same slots. A kernel that
# names both decodes ONCE for the pair. Every diversity we have bought so far cost a decode group;
# this one is free at inference, which is the axis `comp/board.jsonl` says the board actually prices.
#
# WHY 4 REGIONS AND NOT 3. 12 slices splits evenly four ways at three slices a region, and 4 is what
# `depth_regions` runs, so a difference between the two arms is the BAND and not the split. An uneven
# split would confound the transfer question with a region-size question nobody asked.
#
# control  lr4e-5_ws_s2026 = 0.8525, same cache, same recipe, same rate, `--slice-regions` absent
#          (which is 1, the historic single amax, bit-for-bit).
# cost     identical to the control — the region maximum is taken over features already computed.
#
# PREDICTION, written before the run. If depth allocation is the mechanism, this clears 0.8525 by less
# than `depth_regions` clears 0.8578, because a 0.20-0.80 band has less depth for the regions to
# separate: the outer tenth that most needs its own budget is not in this band at all. Flat here with
# `depth_regions` positive says region pooling only pays once a band is wide enough to hold structures
# that lose the max — which would make it a property of the BAND arms and not a general fix, and would
# leave the wide-band pair as the only place it belongs. Flat in BOTH is the pooled-budget argument
# refuted, and the two band members go back to being two readings rather than two halves of one trade.
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.

extends = ["_family.toml"]

[encoder]
backbone_lr = 4e-05

[model]
slice_pooling = "max"
slice_regions = 4

[optim]
epochs = 12

[meta]
hypothesis = "The same region pooling as `depth_regions`, on the band every OTHER member reads: 0.20-0.80 at 12"
status = "done"
out = "depth_regions_narrow_s2026"
