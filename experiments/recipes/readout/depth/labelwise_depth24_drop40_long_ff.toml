# bead: knee-sexix
# unmeasurable: labelwise_depth24_drop40_long_ff fits --fold -1, so it holds no study back and no ledger row
#               can price it (knee-s8kim). Its holdout TWIN labelwise_depth24_drop40_long_s2026 reads 0.9053
#               ledger75, the best honest solo on disk.
#
# WHAT THIS ARM IS
#   `labelwise_depth24_drop40_long`'s line plus `--fold -1 --ema`, the second seat of the refit road that
#   `labelwise_ext_drop40_long_ff` opened. Run AHEAD of fullseat_v1's board reading (ref 56246750) because
#   the card is otherwise idle (owner 2026-09-15: "gpu is free"); its reading is fullseat_v1's band.
#
# PRE-REGISTRATION (board). fullseat_v1 >= 0.947: this seat swaps for its twin in the next entry.
#   fullseat_v1 <= 0.946: this checkpoint is parked, not shipped, and the refit road stops.
#
# deliberate: --fold -1 --ema — the champion's own fit, matched to labelwise_ext_drop40_long_ff.
# deliberate: --slot-dropout 0.40 --epochs 24 — imported operating point (knee-yotj8), inherited from the twin.
# deliberate: --slices 24 --batch 10 --calibrated-targets --hold-annotations — inherited from the twin.
# deliberate: --vram-gb 22 — owner VRAM cap 50-70% of the card; the twin's 28 predates DeviceBudget.needed().
#
# CARD. ~25% more studies per epoch than the twin, ~3 h (unverified). Nothing else of ours on the card.

extends = ["_family.toml"]

[data]
band_high = 0.9
band_low = 0.1
slices = 24

[encoder]
backbone_lr = 4e-05

[model]
slice_pooling = "labelwise"

[optim]
batch = 10
ema = true
epochs = 24

[regularisation]
slot_dropout = 0.4

[run]
fold = -1
vram_gb = 22.0

[targets]
calibrated_targets = true
hold_annotations = true

[meta]
hypothesis = "unmeasurable: labelwise_depth24_drop40_long_ff fits --fold -1, so it holds no study back and no ledger row"
bead = "knee-sexix"
status = "done"
out = "labelwise_depth24_drop40_long_ff"
