# THE MISSING CELL OF THE SECOND SQUARE. Region pooling has been read at two corners and they are
# diagonal, not paired: `depth_regions` is 20 slices on 0.10-0.90 and `depth_regions_narrow` is 12
# slices on 0.20-0.80, so every difference between them mixes span with density and neither can say
# what the span alone does to a pooled read. This is 12 slices on 0.10-0.90 - `depth_regions_narrow`
# with the span moved and nothing else - which is exactly the single-variable move `band_span` made
# for the max-pooled read. It needs no decode: `band_span` already wrote 336px_12sl_0-1band.
#
# THE MECHANISM UNDER TEST is whether the span gain is a COVERAGE gain or a MAX-POOL artefact. The
# square that just closed measured span at +0.0039 under `--slice-pooling max`, and a max over more
# slices is also a wider net for one bright slice: a diffuse finding that shows on the outer tenths
# reaches the head by winning a max it would otherwise not be entered in. Region pooling already
# averages inside four depth bands, so if the gain were the net rather than the coverage it should
# shrink here toward zero. If it is the coverage - the outer tenths carrying signal no inner slice
# holds - it should reproduce at roughly its measured size, the way span reproduced at both slice
# counts under max.
#
# THE PREDICTION: the mean lands between 0.8578 and 0.8608 (`depth_regions_narrow` 0.8554 plus the
# +0.0039 span main effect, with the floor's width around it), and the label signature carries the
# REGIONAL group that span bought under max - ACL, Contusion, Baker's, Effusion positive against
# `depth_regions_narrow`.
#
# THE REFUTATION CONDITION is the mean landing at or below 0.8554 - no gain at all over the narrow
# pooled arm - WITH the regional group flat or negative. That would mean span's +0.0039 was the max
# operator finding a wider net rather than the band carrying signal, the coverage story that this
# whole line has been written on is wrong, and the correct next move is to stop widening bands and
# start reading what the max is actually selecting.
#
# It is also the roster candidate this axis owes: both parents make the best-five of the 36-record
# re-search, and no seated member reads a pooled wide-span group at all.
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.
# 18 RATHER THAN THE 28 ITS SIBLINGS ASK, because the co-tenant took the card while this arm waited.
# biohub_kaggle started training at 19:37 and holds about 13 GB, so free at handoff is ~19 GB, not 31.
# The ask is a cap on PYTORCH'S ALLOCATOR and not a batch size, so this changes no recipe and keeps the
# arm matched to `depth_regions_narrow` - and that arm, the same recipe minus the band, actually peaked
# at 16.24 GB reserved. The 28 was twelve gigabytes of slack it never used, which is harmless on an
# empty card and is the PCIe-paging crawl when a co-tenant holds the difference (lora.sh measured 30 as
# worse than 26 for this reason). 18 clears the measured peak and stays under what will be free.

extends = ["_family.toml"]

[data]
band_high = 0.9
band_low = 0.1

[encoder]
backbone_lr = 4e-05

[model]
slice_pooling = "max"
slice_regions = 4

[optim]
epochs = 12

[meta]
hypothesis = "THE MISSING CELL OF THE SECOND SQUARE. Region pooling has been read at two corners and they are"
status = "done"
out = "depth_regions_span_s2026"
