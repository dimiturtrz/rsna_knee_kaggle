#
# ONE VARIABLE OFF slot_dropout_hi.sh: --slot-dropout 0.40 -> 0.55. Same 12 epochs, same recipe, same
# control, byte-identical otherwise.
#
# THE CURVE SO FAR, each row measured against band_dense_s2026 in the SAME pass, calibration gate passed
# both times (control reproduced -0.0361 exactly; slot_cost inside +/-0.0001 on every row):
#
#   dose        0.00      0.25      0.40
#   decode_cost -0.0361   -0.0271   -0.0229
#   vs control  --        +0.0090   +0.0132        (2.4 sd then 3.5 sd of the eleven-member pool)
#   per unit    --        0.036/u   0.028/u        <- ALREADY SHRINKING. That is the null.
#
# Two points on a monotone line cannot say where the line turns, and the per-unit rate is already falling.
# A saturating curve and a still-climbing one are indistinguishable from where this project stands, and one
# more dose is the cheapest thing that separates them.
#
# THE READING IS CROSS-SITE, and the own holdout is a safety check only. holdout909 is drawn from the same
# decode as training, so it is blind BY CONSTRUCTION to this axis: 0.25 read 0.8592 and 0.40 read 0.8551
# against the control's 0.8578, both knob-sized, neither deciding.
#
# PRE-REGISTERED BANDS (full text and their reasons in knee-yotj8):
#   OWN HOLDOUT   >= 0.8480 intact, proceed whatever the sign. < 0.8480 the lane dies here. The floor is
#                 0.0020 below the 0.40 arm's because 0.40 itself landed at 0.8551, and a 0.8500 floor
#                 would now refuse on a decline the previous dose already showed was affordable.
#   CROSS-SITE    >= -0.0195 STILL CLIMBING, 0.70 becomes the next point.
#                 -0.0196..-0.0229 SATURATING -- 0.40 is the operating point and the dose becomes a recipe
#                 TERM at a KNOWN optimum. This is the more useful outcome, not the disappointing one.
#                 -0.0230..-0.0300 TURNED OVER; 0.40 stands, axis closes.
#                 < -0.0300 the effect does not survive at high dose, which retrospectively weakens the
#                 mechanism behind both dose entries shipped today whatever the board returns for them.
#
# PRICE: ~1.3 h. P(clears >= -0.0195) ~ 0.30; P(it resolves the ceiling either way) ~ 0.85.
#
# control  band_dense_s2026 = 0.8578 (decode -0.0361, measured 2026-09-12, re-measured in the same pass)

