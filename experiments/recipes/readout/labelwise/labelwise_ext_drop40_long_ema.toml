# bead: knee-0ed8f
# reading: labelwise_ext_drop40_long_ema_s2026.holdout.npz
#
# WHAT THIS ARM IS
#   `labelwise_ext_drop40_long`'s byte-identical line with `--ema` ADDED. Nothing else moves, and it
#   keeps the twin's fold, so it is the first matched single-variable ema contrast the shipping recipe
#   has ever had.
#
# THE CONFOUND THIS EXISTS TO BREAK
#   Read off the run stamps 2026-09-20: every fold-0 member of the drop40 corner is `ema False`, and
#   every `_ff` refit is `ema True`. The only `ema True` fold-0 members are the `chainfour` family, a
#   different recipe. So on THIS recipe ema-on has only ever existed under `--fold -1`, which holds
#   nothing back and which no ledger row can price. The axis is confounded with the ruler, and the
#   +0.0049 that `matched_axes` reports for `ema False > True` is therefore a CROSS-MEMBER estimate
#   (n=2, both single-seed, pooled mean under the 0.0062 seed spread) rather than a contrast on the ship.
#
# WHY THE OFFLINE RULER AND NOT THE BOARD SLOT
#   knee-f2mj3 spends a slot today on `labelwise_ext_drop40_long_noema_ff` as a solo against
#   `extffsolo_v1` (0.945). Its own pre-registration names flat-within-0.004 as a live outcome, because
#   2 sd of the top-band board residual is ~0.004 while the effect under test is ~0.005. The board is
#   very likely unable to resolve the question the slot is being spent on. This ruler can: the paired
#   holdout floor is 0.0053 and the top-band `ledger75` residual sd is 0.0017.
#
# NOT A CHAMPION ATTEMPT
#   knee-fbo5e prices the gap to first at 0.011 offline and every open axis at ~0.003-0.005. This arm
#   cannot take first place and does not claim to. It is an INSTRUMENT, run on an otherwise idle card,
#   and what it buys is the `--ema` decision for every future `_ff` refit — which is how every champion
#   attempt on this lineage is built.
#
# deliberate: --ema — THIS ARM'S VARIABLE. The flag is otherwise absent from every fold-0 arm in the
#             corner, which is the confound above.
# deliberate: fold — omitted, so the default fold 0 applies, matching the twin. It is not this arm's
#             variable, and changing it is what created the confound in the first place.
# deliberate: --slot-dropout 0.40 — imported operating point (knee-yotj8), not a swept knob.
# deliberate: --epochs 24 --scheme extended --slices 20 --batch 4 --accumulate 3 --calibrated-targets
#             --hold-annotations --backbone-lr 4e-5 — inherited verbatim from the twin. Unchanged.
#
# CARD. The twin measured 206 s an epoch over 24 epochs on this card, so ~1.4 h. An EMA adds one
#   multi-tensor kernel a step (~0.2%), so the estimate stands. Nothing else of ours may share the
#   card (`card_check`).
#
