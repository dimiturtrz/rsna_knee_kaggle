# labelwise_extended.sh — the nine-slot cache at the pooling that reads each diagnosis separately.
#
# bead: knee-q2yz7
# reading: labelwise_extended_s2026.holdout.npz
#
# THE AXIS, AND WHY THIS ARM RATHER THAN A SECOND BAND ARM. `extended_band` prices the three extra
# channels at the geometry whose control is EXACT and whose head pools slices with `max`. That arm answers
# "do the channels carry anything at all". It cannot answer "does the head that reads diagnoses separately
# have more use for them than a max-pool does", and the affinity table says that is the live question: the
# three channels are not diffusely informative, they are SEVEN CELLS AT 1.00 SPREAD OVER SEVEN FINDINGS
# (MCL and both menisci via COR_FLUID_NOFS, PF OA via AX_T1, Effusion / Synovitis / Baker's via
# AX_FLUID_NOFS), and five findings LOSE — every extra is non-fat-suppressed, so marrow oedema is invisible
# in them and ACL, both OA columns, Contusion and Fracture gain nothing. A single pooled representation has
# to carry that as one compromise. `--slice-pooling labelwise` gives each diagnosis its own pooled read,
# which is the one head in the tree whose shape matches how the extra channels are actually distributed.
#
# ONE VARIABLE, AND THE CONTROL IS ON THE LEDGER. Byte-identical to `labelwise_dense` (0.8613 @midpoint on
# the 909 frame, experiments/README.md:5623, the third-best solo the project owns) except `--scheme
# extended` and the batch split below. Same epochs, same slices, same band, same backbone-lr, same
# `--calibrated-targets --hold-annotations`. So this is the same one-variable construction as
# `extended_band` at a different pooling, and the two together separate INPUT from HEAD: the channels
# reading flat under `max` and positive under `labelwise` is a fact about pooling, not about the pixels.
#
# THE CONFOUND IS ALREADY PRICED AND DOES NOT NEED REPRICING HERE (D185, card-free, this frame, this cut).
# The three protocol-presence bits fitted on top of a member read 0.8578 -> 0.8557, delta -0.0021: the
# pathology those bits mark is pathology the canonical six already show, so a positive delta here cannot be
# charged to three bits of metadata. What the bound does NOT cover is a bit-by-image interaction a
# four-parameter logistic cannot represent, and a labelwise head is exactly the shape that could hold one —
# so if this arm reads positive and `extended_band` does not, the zeroed-channel re-score becomes MANDATORY
# rather than a follow-up, because that is the one configuration where the cheap bound stops binding.
#
# VRAM, DERIVED BEFORE THE CARD AND NOT AFTER — the failure `extended_band` already paid for. Run 1 of that
# arm derived 32.5 GB against a 31.8 GB card and started anyway: `await_headroom` documents that Windows
# pages over PCIe rather than raising, so it crawled at 4064 s an epoch against a 361 s control, 11.3x, and
# 68 minutes of card went to discovering it. `labelwise_dense` reserves 28.26 GB at six slots (its own
# header), and nine slots scale `DeviceBudget.needed`'s activation term by 1.5, so batch 12 here would
# derive well past 40 GB — the same failure, worse. `--batch 4 --accumulate 3` holds the effective batch at
# 12, identical to the control's, with no batch-norm in this stack to make accumulation differ from a wide
# step. The launch line must print a cap BELOW 31.8 GB; if it does not, kill it rather than let it page.
#
# PRE-REGISTERED, against labelwise_dense 0.8613 @midpoint, and read jointly with `extended_band`:
#   both >= +0.0015          the SEE axis is live and pooling-independent. The plane scheme and the mm-FOV
#                            multiscale scheme follow, in that order, and this member ships.
#   this >= +0.0015, band flat   the channels are real and only a per-diagnosis head can spend them. The
#                            follow-up is `--slot-pooling attend` on the band arm, not another scheme.
#   this flat, band >= +0.0015   the channels inform a pooled read and the labelwise head dilutes them
#                            across twelve columns. Fact about the head.
#   both flat or negative    nine slots do not pay at this depth under either pooling, and no further
#                            decode-scale cost is paid for the SEE axis. That is the axis closed on two
#                            heads rather than on one, which is what a single arm could never license.
#
# PRICE: ~1.5 h. Cache built 2026-09-08 06:39Z, images_336px_20sl_0.1-0.9band_extended.npy,
# (4407, 9, 20, 336, 336) uint8 = 89.6 GB — already on disk, this arm adds no decode. No submission slot:
# the reading is offline against a control already on the ledger.

extends = ["_family.toml"]

[data]
band_high = 0.9
band_low = 0.1
scheme = "extended"
slices = 20

[model]
slice_pooling = "labelwise"

[optim]
accumulate = 3
batch = 4
epochs = 12

[targets]
calibrated_targets = true
hold_annotations = true

[meta]
hypothesis = "labelwise_extended.sh — the nine-slot cache at the pooling that reads each diagnosis separately."
bead = "knee-q2yz7"
status = "done"
out = "labelwise_extended_s2026"
