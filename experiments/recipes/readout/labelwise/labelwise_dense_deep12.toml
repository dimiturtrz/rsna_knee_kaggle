# labelwise_dense_deep12.sh — the capacity axis spent where this machine will actually run it.
#
# bead: knee-mm6v0
# reading: labelwise_dense_deep12_s2026.holdout.npz
#
# WHAT LICENSES THIS ARM. Capacity is the one axis that has ever cleared this project's noise floor:
# `base_labelwise224` 0.8899 against `labelwise224` 0.8832 is +0.0067 over a 0.0062 paired floor,
# converged, 909 studies, and that result disowned the three `rank24` rows that had read capacity flat on
# a max head. The obvious way to spend it — a base trunk at the shipping corner — is barred by the machine
# and not by an argument: `base_labelwise336` has now OOMed five times, and `--recompute-activations`,
# the slice count, `torch.compile` and the `--vram-gb` cap are each ruled out by measurement in that arm's
# own header. The binder is allocator fragmentation, ~28.5 GiB reserved against 23.21 in use, and
# `expandable_segments` is a confirmed no-op on this Windows machine.
#
# So width is unreachable and DEPTH is the same axis by another route. `--unfreeze-last` is fitted at 6 and
# has never been the subject of an arm — it is a constant every recipe inherited. A ViT-S has 12 blocks, so
# this doubles the trainable parameter count without touching the trunk, the resolution, the slice count or
# the batch, all of which are what the machine refuses to move.
#
# ONE CHANGE against `labelwise_dense`: `--unfreeze-last 12`. Same small trunk, same 336 px, same 20
# slices, same 0.1-0.9 band, same `--calibrated-targets --hold-annotations`, same batch 12, same array on
# disk, same 12 epochs. The control is free at 0.8964 ledger75, epoch 7 of 12, 909 studies.
#
# MECHANISM. The frozen lower blocks are DINOv2 features fitted to natural images; the six trainable upper
# blocks are all that has ever adapted to knee MRI. The claim is that the domain gap is not confined to the
# top half — early-block filters tuned for photographic statistics are the wrong basis for a modality with
# no colour, different noise and a different notion of edge, and six blocks of adaptation cannot re-basis
# what they are fed. The competing outcome is that 909 studies cannot support twice the trainable
# parameters and the run overfits, which would show as a peak well before epoch 12, or that unfreezing the
# early blocks at a uniform 4e-5 destroys the pretrained features outright, which would show as a score
# BELOW the 224 corner rather than merely below the control. Those two are distinguishable by the epoch of
# the peak and are why `--layer-decay` (fitted at 1.0, i.e. off) is the NEXT arm and not a second variable
# in this one.
#
# PRICE, out loud. `labelwise_dense_drop40_long36` is ~7.8 h for 36 epochs at this corner, so ~780 s/epoch
# and ~2.6 h for 12. More trainable blocks means more checkpoint boundaries to store, so this costs
# somewhat more per step than the control did. Zero decode, zero submission slots, control free.
# P(clears 0.9026) ~ 0.30. P(clears the 1.5% bar) ~ 0.08.
#
# BANDS, pre-registered, ledger75, against labelwise_dense 0.8964.
#   * >= 0.9026  depth carries the capacity axis where width cannot, and `--unfreeze-last 6` is a constant
#                that has been costing this project a result for its whole history. The next arm is this
#                recipe at `--epochs 36 --slot-dropout 0.40`, which is the schedule the best solo runs, and
#                that is the deliverable.
#   * 0.8964-0.9026  directional. Keep nothing, compose nothing. Read the epoch of the peak: still
#                improving at 12 means the budget bound it and the 36-epoch version is the re-test, peaking
#                early means 909 studies will not support the parameters and `--layer-decay` is.
#   * <  0.8964  read HOW far below. Below 0.8899 is the destroyed-features verdict and `--layer-decay 0.75`
#                is the re-test rather than a retreat. Between the two is ordinary overfitting and the
#                re-test is `--slot-dropout 0.40`.
#
# READ THE FOCAL LABELS, NOT ONLY THE MEAN. Lateral Meniscus -0.1925, ACL -0.1225, MCL -0.0964 lead the
# model-side error census. A re-basing of the early blocks should move the labels that depend on fine
# linear structure — the ligaments — more than the diffuse ones. A mean that moves without them is not this
# mechanism. Say so.
#
# HARNESS CHECK. The printed recipe must name "unfreeze_last": "12" AND "variant": "small" AND
# "image_size": "336" AND "slices": "20" AND "slice_pooling": "labelwise" AND "calibrated_targets": "True".
# Stamped values are STRINGS; a grep for lowercase true returns empty and reads like a missing flag. If
# "unfreeze_last" reads "6" this is the control re-run and the card is being spent on nothing.
#
# control  labelwise_dense_s2026 = 0.8964 ledger75 @ epoch 7, 909 studies. No control run is owed.
#
# deliberate: --unfreeze-last 12 (the arm's thesis)
# deliberate: --vram-gb 26 — the cap that leaves the driver its room on a 31.84 GB card. A cap set higher
#             PERMITS PCIe paging, which reads as 100% utilisation at a quarter of the power budget rather
#             than as a crash. Diagnose by img/s against the control, never by utilisation.
#
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.

extends = ["_family.toml"]

[data]
band_high = 0.9
band_low = 0.1
slices = 20

[encoder]
unfreeze_last = 12

[model]
slice_pooling = "labelwise"

[optim]
epochs = 12

[run]
vram_gb = 26.0

[targets]
calibrated_targets = true
hold_annotations = true

[meta]
hypothesis = "labelwise_dense_deep12.sh — the capacity axis spent where this machine will actually run it."
