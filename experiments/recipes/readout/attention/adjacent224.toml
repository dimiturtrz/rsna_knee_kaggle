# adjacent224.sh — the twelve slices drawn CONTIGUOUSLY instead of spread across the band.
#
# bead: knee-e6sj
#
# WHY THIS ARM, AND WHY IT IS NOT THE BAND AXIS AGAIN. Eleven arms in this ledger have varied the band's
# WIDTH (0.20-0.80 = 0.8525, 0.10-0.90 = 0.8565, 0.00-1.00 = 0.8427). NONE has varied its SPACING RULE.
# `slot_reader` drew every slice this project has ever fed with `np.linspace`, so under every one of
# those eleven readings no two sampled slices are ever adjacent in the volume — at any width. Width is
# EXTENT, how much depth is visible; spacing is CONTIGUITY, whether consecutive samples are consecutive
# in millimetres. They are different mechanisms, and the interior optimum the band arms found says
# nothing about this one.
#
# THE MECHANISM. A meniscal tear is 1-3 mm of signal that has to touch an articular surface on two
# CONSECUTIVE slices — that continuity is what the finding is DEFINED by, and a spread sample cannot
# show it however wide or narrow the band is. Meniscus and ACL are three of the four labels where our
# model still trails its own teacher, and they are exactly the structures defined by cross-slice
# continuity rather than by a single bright plane.
#
# EXTERNAL EVIDENCE. Competition forum topic 737597, a rival, fold 0: centre-9 ADJACENT beat 9
# equal-spaced across 24 by +0.018 — "slice geometry mattered more than resolution". That is 3x our
# 0.0062 three-seed floor and above the 1.5% bar. It is not our measurement and is one fold, so it is a
# reason to SPEND 20 minutes, not a number to quote.
#
# WHAT IT COSTS AND WHY 224. The decode is CPU-bound and the arm is the cheapest useful one in the
# ledger: ~94 s/epoch, ~8 GB, ~19 min for twelve epochs, so it overlaps whatever holds the card. It is
# NOT run at 336: that would be a 99 GB cache and this axis has never been measured at all. Nothing on
# disk is invalidated either way — `--spacing adjacent` is a new cache PATH, and `spread` keeps the
# historic name every seated member was fitted under.
#
# ONE VARIABLE against the control: `--spacing adjacent`. Byte-identical to `native224` otherwise.
#
# THE FALSIFIABLE PART, written before the run.
#   * >= +0.010. Contiguity is a real lever and the first above-floor one in a week. Rebuild the 336
#     cache on its account and re-run the seated recipes under it.
#   * +0.006 to +0.010. Directional, under the bar. Keep the member for its pixel distance — a
#     contiguous read is a different input tensor from every seated member — and re-test at 20 slices.
#   * within +/- 0.006. The axis closes: spread and adjacent are the same information at 12 slices, and
#     the rival's +0.018 belongs to their geometry (9 of 24) rather than to contiguity as such.
#   * <= -0.006. Spread sampling is LOAD-BEARING — the spread of the band is buying more than the
#     continuity costs — and the follow-up is a WIDER band read adjacently, not a narrower one.
#
# HARNESS CHECK. The printed recipe must name "spacing": "adjacent" and "image_size": "224". The
# adjacent cache must exist or the run builds it first; check the log's opening lines before timing
# anything. A spread cache and an adjacent cache have identical shapes and different pixels, so the
# cache NAME is the only thing that says which was read — `336px_12sl` vs `224px_12sl_adjacent`.
#
# control  native224 = 0.8502 (best epoch 7), byte-identical recipe under the historic spread rule.
#
# deliberate: --spacing adjacent (the arm's thesis)
#
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.

extends = ["_family.toml"]

[data]
image_size = 224
spacing = "adjacent"

[encoder]
backbone_lr = 4e-05

[model]
slice_pooling = "max"

[meta]
hypothesis = "adjacent224.sh — the twelve slices drawn CONTIGUOUSLY instead of spread across the band."
bead = "knee-e6sj"
status = "done"
out = "adjacent224_s2026"
