# stack224.sh — read the WHOLE stack once, at the resolution that makes it affordable.
#
# bead: knee-qphd
#
# THE CELL NO MEMBER HAS EVER OCCUPIED. Across 137 arm scripts the slice count is 20 (95), 12 (43) or
# 16 (1), and nothing above 20. A sagittal knee series holds 30-40 slices, so every member this project
# owns has read a third to a half of the volume with a sampler choosing which half. The public frontier
# fills its five slots with 64 slices (18+14+12+8+12, research/deep_dives/2026-08-23_published-per-label-auc-vs-ours.md).
#
# WHY THE SLICE-COUNT LEDGER DOES NOT ALREADY ANSWER IT. Every reading we hold is 12 -> 20: +0.0080,
# +0.0013, -0.0001 under max pooling (knee-ezz), -0.0028 on the merged corpus. That is a change of WHICH
# SUBSET at fixed partial coverage. 36 of a 30-40 slice stack is the first read that cannot miss a slice,
# which is a different mechanism and the only one that can answer whether a thin finding falls between
# our samples.
#
# WHY IT IS AFFORDABLE ONLY HERE. VRAM is a function of slice count and nothing else (README:253): at
# 336 px, 20 slices reserve 26.92 GB of 32. `native224` reserved 8124 MiB at 12 slices, so 36 lands near
# 24.4 GB. knee-s9cr's owner directive makes 224 the standing exploration resolution and native224's
# -0.0023 against the 336 control says it costs nothing. `band224.sh` was written at 20 slices and never
# ran, so the 224 slice axis is untested end to end.
#
# TWO FLAGS, ONE CONCEPT. `--slices 36` with the band opened to 0.05-0.95. They cannot be separated: 36
# slices inside a 0.2-0.8 band resamples the middle 60% at triple density instead of covering the volume.
# Everything else is `native224`'s invocation untouched.
#
# CONTROL: `native224_s2026` = 0.8502, same fold-0 holdout, same `report_labels_v2` ruler.
#
# READ IT PER LABEL, NOT ONLY ON THE MEAN. The mechanism names which labels it should move — the thin
# findings that live on few slices. A twelve-label mean averages a two-label effect away. Flat mean with
# Lateral Meniscus and Fracture both up is the finding, and it points at per-finding slice budgeting.
#
# HARNESS CHECK BEFORE ANY READING. The printed recipe must show `"image_size": "224"`, `"slices": "36"`,
# band [0.05, 0.95], `"slice_pooling": "max"`, `"whole_stack": "True"`, `"fold": "0"`, and the log must
# load 4,406 studies holding out 909. Three runs have entered this ledger as facts about an architecture
# when they were facts about a flag that never landed.
#
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.
# control  native224_s2026 = 0.8502 (declared 2026-09-03 from this header own prose, knee-sgzgc)

extends = ["_family.toml"]

[data]
band_high = 0.95
band_low = 0.05
image_size = 224
slices = 36

[encoder]
backbone_lr = 4e-05

[meta]
hypothesis = "stack224.sh — read the WHOLE stack once, at the resolution that makes it affordable."
bead = "knee-qphd"
status = "queued"
out = "stack224_s2026"
