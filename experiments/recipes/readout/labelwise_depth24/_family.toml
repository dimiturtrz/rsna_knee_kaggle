# labelwise_depth24: 2 arms moved from experiments/arms (Phase B, knee-ij7lk.1).

extends = []

[data]
band_high = 0.9
band_low = 0.1
slices = 24

[encoder]
backbone_lr = 4e-05
recompute_activations = true
