# radiodino_corpus.sh — the PRETRAINING CORPUS, with the architecture AND the objective held fixed.
#
# bead: knee-p7it8
# deliberate: --variant radiodinob16 (the arm's thesis — the corpus swap, at zero architectural and zero
#             objective distance)
#
# WHY THIS ARM, AND WHY IT IS NOT `radnet_family` AGAIN. This project has now varied the trunk on two
# axes and never on the third. `vit_in21k` moved the OBJECTIVE with the architecture held, and
# `radnet_family` moved the corpus and the objective and the architecture all at once — 7M parameters,
# 165-way supervision, dense connectivity, medical images — and read 0.6716, converged, against a 0.75
# floor. That number closed the medical-SUPERVISED cell, and it is routinely quoted as though it closed
# medical pretraining. It cannot: with three variables moving, a null says nothing about which one
# carried it.
#
# THAT 0.6716 IS VOID, AND NOT FOR THE THREE-VARIABLE REASON ABOVE (knee-cj40f, measured 2026-09-04).
# It is a fact about a broken harness. Freezing here is `requires_grad_(False)`, which pins PARAMETERS
# and does nothing to BUFFERS — and `running_mean`/`running_var` are buffers, updated by every forward
# in `train()` mode, which `trainer.py` puts the whole model into each epoch. DenseNet-121's frozen
# prefix is BatchNorm throughout. Measured in the checkpoint: all 121 BatchNorm layers, `norm0` and the
# entire frozen prefix included, carry `num_batches_tracked = 226711`. At momentum 0.1 the effective
# window is ~10 batches, so the RadImageNet statistics were not perturbed, they were REPLACED — while
# the conv weights that consume them stayed pinned to RadImageNet and could not compensate, because
# they were frozen. The frozen-features ridge probe reads 0.8197 on the same trunk precisely because it
# runs in `eval()` with the original statistics.
#
# WHAT THAT DOES TO THIS ARM'S READING. The magnitude is unmeasurable — the pretrained weights are gone
# locally (request-gated at source, mirror withdrawn), so no pretrained-vs-trained diff can be taken.
# So 0.6716 is a LOWER BOUND on that trunk under a defect, not a reading of medical supervision. The
# REFUTES branch below must NOT be read as "the corpus killed radnet_family": that arm's number no
# longer says anything about the corpus. This arm is now the FIRST clean measurement of the medical
# corpus at this scale rather than the second, and its four branches stand on their own controls
# (`base_dense` 0.8512, `v3base_dense` 0.8455), which is where they should always have stood.
#
# THIS TRUNK IS NOT EXPOSED TO THAT DEFECT. It is a ViT: LayerNorm throughout, no running statistics,
# nothing to replace. The blast radius is CNN trunks with a frozen prefix — DenseNet and ResNet here;
# ConvNeXt, Swin and every ViT use LayerNorm and are unaffected.
#
# `Snarcy/RadioDino-b16` is the missing control for exactly that reading. ViT-B/16, twelve blocks, 768
# wide, global attention over the same patch grid, trained with DINO self-distillation — the same
# architecture as `v3base` and the same objective — differing from it in the pretraining CORPUS alone:
# 1.35M RadImageNet radiology images against LVD-1689M natural ones. Run against the controls already on
# disk it separates "RadImageNet is the wrong corpus" from "165-way supervision is the wrong objective",
# which `radnet_family` on its own cannot do.
#
# SINGLE VARIABLE, and it is the corpus. This is `vit_in21k.sh`'s invocation with `--variant
# radiodinob16` substituted, which is itself `v3base_dense.sh`'s recipe. Rate, slices, band, pooling,
# whole-stack, epochs, schedule and batch are held at the values the controls were measured under. At
# 336 px and patch 16 the token count is 441, identical to both, so the compute is matched too.
#
# THE THIRD POINT ON ONE LINE. With this arm the ViT-B/16 row of the trunk table reads, at one recipe:
#   base_dense      0.8512   DINOv2 self-distillation,  natural (LVD-142M)
#   v3base_dense    0.8455   DINOv3 self-distillation,  natural (LVD-1689M)
#   vit_in21k       weak     AugReg supervision,        natural (IN-21k) — truncated at epoch 5, 0.044
#                                                       below a member this project had already declined
#   radiodino_corpus   ?     DINO self-distillation,    MEDICAL (RadImageNet 1.35M)
# Three of the four differ in one variable from at least one other, which is the property no previous
# encoder comparison here has had.
#
# WHERE IT SITS ON THE knee-y59c CURVE, and this is the real reason to spend the card. That measurement
# anti-correlates solo strength with distance-from-DINOv2 across seven trunks, and it has been used to
# predict every trunk decision since. But "distance from DINOv2" is a compound of architecture, objective
# and corpus, and no arm has ever pulled them apart. This trunk sits at ~0 on architecture, ~0 on
# objective and far on corpus. Whatever it reads is a statement about WHICH distance that curve was
# measuring — which is why this is priced as an INSTRUMENT and not as a seat bid.
#
# IMAGENET NORMALIZATION, DECLARED BY THE RELEASE. The shipped `pretrained_cfg` names the ImageNet mean
# and std outright, so unlike RadImageNet's bare OrderedDict — two mutually exclusive documented recipes
# and a third from a published downstream user, settled only by a post-`norm0` measurement — there is
# nothing to decide here and nothing to sweep. The registry entry declares it.
#
# 224 IS THE PRETRAINED READ and this arm runs at 336, which every ViT here already does by interpolating
# position embeddings. That is a real deviation from the pretrained geometry and it is shared with both
# controls, so it does not confound the comparison.
#
# CC-BY-4.0 AND UNGATED, so no HF token step and mirroring is permitted with attribution. No Kaggle mount
# yet: this trains here and cannot be submitted until the weights are mirrored, deferred until a member
# earns the seat. That licence is also the reason this trunk is reachable where RadImageNet's own weights
# are not — those are request-gated at source and publish no licence, which is what withdrew
# `dimiturnt/radimagenet-densenet121`.
#
# THE WEIGHTS ARE ALREADY LOCAL at `D:/data/volumetric/mri/models/foreign/hf/RadioDino-b16`, fetched 2026-09-03. They were pulled
# with `local_dir`, which does NOT populate the HF cache, so the first load may fetch again. That is a
# minute of network, not a failure, but it is the kind of thing the smoke exists to surface.
#
# control  v3base_dense = 0.8455 (best epoch 6), same recipe, same architecture, same objective, natural
#          corpus. base_dense = 0.8512 is the second control and the stronger one.
#          radnet_family = 0.6716 is the medical-corpus point with the objective and architecture ALSO
#          moved; it is the reading this arm exists to disambiguate, not a control.
#          The non-DINOv2 seat bar is 0.8521.
# cost     ~2.5-2.9 h at 12 epochs — `v3base_dense` and `vit_in21k` both ran there at an identical token
#          count and an identical parameter count (86.6M against 86.4M).
# seat     none pre-registered. Card-free `record_mix` afterwards, and only on the correlation reading.
#
# PRE-REGISTERED, four outcomes. Floor 0.0062, so the twin's band is 0.8393-0.8517.
#   THE CORPUS PAYS — solo >= 0.8517. Medical pretraining transfers BETTER than natural at fixed
#     architecture and fixed objective. That would make `radnet_family`'s 0.6716 a statement about
#     SUPERVISION or CAPACITY and not about RadImageNet, reopen the medical-corpus lane that number was
#     read as closing, and make MRI-CORE's build cost worth paying immediately.
#   MATCHES — 0.8393-0.8516. The corpus does not move competence at this capacity. The seat value is then
#     the whole question, and it is the good case for `knee-m69u`: a matched solo with a POSITIVE seat
#     says the corpus moves the trunk's OPINION rather than its competence, which is the diversity the
#     pool needs and the only mechanism found so far that supplies it without costing strength.
#   COSTS — 0.80-0.8392. Medical pretraining transfers worse here at fixed architecture. Price the seat
#     before concluding: `base_dense` lost its control outside the floor and won the board anyway.
#   REFUTES — < 0.80. Then the corpus is the variable that killed `radnet_family`, the medical-image row
#     of the grid is closed on a single-variable measurement rather than a three-variable one, and
#     `knee-y59c`'s curve is a statement about pretraining CORPUS rather than about architecture. That
#     would also retire MRI-CORE before its build cost is paid, which is worth the card on its own.
#
# DO NOT ARM THIS WHILE ANOTHER OF OUR JOBS HOLDS THE CARD. Two on one device stretched a three-minute
# member to eleven once; `card_check` blocks on exactly that and is the gate here.
#
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.

extends = ["_family.toml"]

[data]
band_high = 0.9
band_low = 0.1
slices = 20

[encoder]
backbone_lr = 4e-05
recompute_activations = true
variant = "radiodinob16"

[optim]
accumulate = 3
batch = 2

[targets]
rank_weight = 1.0

[meta]
hypothesis = "radiodino_corpus.sh — the PRETRAINING CORPUS, with the architecture AND the objective held fixed."
bead = "knee-p7it8"
status = "done"
out = "radiodino_corpus_s2026"
