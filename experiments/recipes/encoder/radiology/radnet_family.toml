# radnet_family.sh — the empty cell on this project's pretraining grid, filled.
#
# Every trunk this project has fitted falls in one of two cells:
#
#                     self-supervised                        supervised
#   natural images    DINOv2, DINOv3, ConvNeXtV2, V-JEPA2    Swin-base IN-22k, ViT IN-21k
#   medical images    RAD-DINO                               -- EMPTY, until this arm --
#
# RadImageNet DenseNet-121: 1.35M radiology images, 165 supervised classes. Not knee MRI — the corpus
# spans CT, MRI and ultrasound over abdomen, thorax, knee, shoulder and brain — so the claim is domain
# proximity, not task transfer.
#
# WHY THIS AND NOT ANOTHER SEATING. Seven independent board flats closed the seating axis: reweight
# (raptorweight +0.001), add (vjepaseat -0.001), swap (holdswap 0.000), count (dark7 flat), precision
# (spanseat 0.944), pooling lens (lensseat 0.944) and distance-with-quality (distinct14 0.000). What is
# left is what a member IS and what it is TAUGHT, which is `knee-nj4l`'s reading of the 0.937-0.941
# plateau as an architecture monoculture. This arm moves BOTH at once and is the only open lever whose
# mechanism could plausibly deliver the 1.5% bar.
#
# THE PRECEDENT, STATED AT ITS REAL STRENGTH. Nilay et al. report a nine-model ensemble beating its best
# solo by +0.031 F1 with these exact weights in the pool. They report NO ablation with and without the
# DenseNet branch, so +0.031 is a total ensemble gain across three inference paradigms and is not a
# per-branch precedent. It is the reason to look; the argument for the card is the empty cell.
#
# SEVEN MILLION PARAMETERS against 86-88M for every incumbent — a twelfth the capacity of the members it
# would sit beside, and the honest expectation is a weak solo. That is not disqualifying on its own:
# `knee-y59c` measured distance-from-DINOv2 ANTI-correlating with solo strength across seven trunks, and
# every seat this project has actually bought was bought with a mechanism nothing else in the pool had.
# It IS why no seat is pre-registered below.
#
# NORMALIZATION WAS MEASURED, NOT ASSUMED, which is the one thing that could have voided the result
# silently. The release documents two mutually exclusive recipes and a published downstream user reports
# a third. `norm0` is inside the frozen prefix at `--unfreeze-last 6`, so its running statistics cannot
# adapt to a wrong input scale — which makes the question decidable by feeding each candidate and keeping
# the one whose post-`norm0` output is nearest the unit distribution those statistics encode. Both caffe
# forms diverge by five orders of magnitude; HALF wins among the survivors and is also what the PyTorch
# release documents. The encoder entry carries the numbers.
#
# A TWELFTH THE PARAMETERS AND NEARLY THREE TIMES THE ACTIVATION BILL — measured, not guessed. At
# identical flags `vram_need` prices ConvNeXt-base at 14443 MiB and this trunk at 40880, which is above
# the whole card: dense connectivity concatenates every earlier feature map inside a block, so the cost
# tracks resolution and depth rather than parameter count. The smoke refused the arm as written (`card
# had no room: needs 40880 MiB`), and that refusal is the reason `--train-size` is 352 here rather than
# the 448 the rest of the recipe is inherited from. 352 is the smallest stride-32-tileable size at or
# above the CACHE's own resolution — every member of this project reads a `336px_20sl_0.1-0.9band` array
# and `cnx_own_recipe` upsamples it to 448 — so the deviation costs an upsampling factor of 1.05 rather
# than information, which is why it was preferred over cutting slices (20 -> 12 fits at 448 and would
# have cost eight real slices of the stack). 336 itself was tried first and REFUSED at the trainer:
# `radnet121 is patch 32, which cannot tile a 336 px read`. It is still a deviation: a difference against
# `cnx_own_recipe` is a difference in pretraining AND in upsampling, and only the first is what this arm
# is about. If the cell pays, the ResNet-50 follow-up runs at 448.
#
# THE RECIPE IS `cnx_own_recipe`'s, deliberately. It is the best convolutional recipe this project owns
# (0.8186), and holding it fixed means a difference here is about the PRETRAINING rather than about a
# schedule nobody tuned for this trunk. The one thing not inherited is `--backbone-lr`: 4e-4 is the top
# of the ConvNeXt ladder as it stands, and if `cnx_top_rate` (1.2e-3, running) moves that top, this arm
# is re-run at the new rate rather than read as if the rate had been settled.
#
# control  the non-DINOv2 seat bar is 0.8521. The best non-SSL member the project owns is
#          swin_supervised at 0.8331; the best convolutional one is cnx_own_recipe at 0.8186.
# cost     ~1.5-2.5 h at 12 epochs, unpinned: the parameter count is a twelfth of ConvNeXt-base's and
#          the activation bill at matched flags is 2.8x it, so neither figure predicts the epoch time.
# seat     card-free record_mix afterwards, and ONLY on the correlation reading below.
#
# PRE-REGISTERED. Floor 0.0062, board resolution 0.0015.
#   THE CELL PAYS — solo clears 0.8186 (cnx_own_recipe, twelve times the parameters). Then domain
#     pretraining carries signal that natural-image pretraining does not at this capacity, the empty cell
#     is the plateau's cause rather than a coincidence, and the next probe is RadImageNet ResNet-50
#     (23M, same mirror, same load path) at full capacity.
#   WEAK BUT DECORRELATED — solo 0.75-0.8186. This is the EXPECTED branch and it is not a failure: the
#     reading then moves to card-free error correlation against every champion member. If its holdout
#     errors are less correlated with the champion than any incumbent pair is, the seat question is live
#     and `record_mix` answers it without a slot. If it is merely weak AND merely correlated, the cell is
#     filled with a negative and the family is closed with a number.
#   THE CELL IS EMPTY FOR A REASON — solo under 0.75. Then a 7M supervised medical trunk does not
#     transfer to this task at this resolution, and the ONLY thing that re-opens it is capacity: the
#     ResNet-50 from the same mirror, which is a config line on the load path this arm already built.
#
# NO SEAT IS PRE-REGISTERED. No branch above predicts clearing 0.8521, so this buys a submission slot
# only through a mix that beats the champion offline — which is a card-free measurement, not a slot.
#
# bead: knee-jyb6
# ...the non-AutoModel load path this arm is the first consumer of. Serves knee-nj4l (architecture
# monoculture) and knee-nz34 (encoder-family pricing).
#
# deliberate: --variant
#
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.

extends = ["_family.toml"]

[data]
band_high = 0.9
band_low = 0.1
slices = 20
train_size = 352

[encoder]
backbone_lr = 0.0004
variant = "radnet121"

[optim]
accumulate = 6
batch = 1

[run]
vram_gb = 26.0

[targets]
rank_weight = 1.0

[meta]
hypothesis = "radnet_family.sh — the empty cell on this project's pretraining grid, filled."
bead = "knee-jyb6"
status = "done"
out = "radnet_family_s2026"
