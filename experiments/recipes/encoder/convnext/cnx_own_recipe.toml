# cnx_own_recipe.sh — ConvNeXt judged on a recipe fitted to ConvNeXt, which has never happened.
#
# WHY THIS IS NOT A RERUN OF `cnx_dense`. That arm is the ONLY convolutional run this project has ever
# done, against ~189 DINOv2-family runs (knee-zfgn, counted from the variant stamped in each of the 202
# checkpoints on disk). Every knob in $RECIPE — read size, backbone LR, schedule, band, sampling,
# augmentation, batch, pooling — was tuned across those 189. So $RECIPE is a 189-run local optimum around
# DINOv2-small, and handing it unchanged to a convolutional trunk measures OUR TUNING and charges the
# result to the architecture. cnx_dense scored 0.7927 and the ledger wrote "closes encoder diversity as an
# axis" on it. That sentence has been retracted; this arm is what has to run before the trunk is judged.
#
# THE RETRY WAS ALREADY PRE-REGISTERED AND THEN IGNORED, which is the sharper half of the defect.
# `cnx_dense.sh` named four outcomes before it ran. The one that fired reads verbatim:
#
#   THE EXPENSIVE NEGATIVE — solo below 0.80. The head, the band and the slice pooling were all settled on
#   token sequences from a patch-14 ViT; a 121-token grid may simply be too coarse for the slot head's
#   spatial pooling, in which case the reading is about RESOLUTION and the retry is 448 px (a 14x14 grid)
#   BEFORE THE TRUNK IS JUDGED.
#
# 0.7927 is below 0.80. The branch fired. The retry was never run and the verdict was written anyway.
#
# TWO DEVIATIONS FROM `cnx_dense`, BOTH FORCED BY THE ARCHITECTURE RATHER THAN CHOSEN, and deliberately
# moved TOGETHER rather than one per arm. Single-knob arms are the mechanism that starved this family:
# each 2.5-hour arm samples one point on a curve nobody is moving, and at 189:1 the deficit cannot be
# closed one knob at a time. The question this arm asks is not "which knob" but "does the trunk work when
# its recipe is its own" — and if the answer is yes, THEN the knobs get decomposed against a member that
# exists. A negative here is also interpretable: two corrections in the trunk's own favour, still short.
#
#   1. 448 px, not 352. Stride 32 over four halving stages gives a 14x14 grid = 196 tokens, against 121 at
#      352. This is the arm's own pre-registered retry, and the argument for it is the slot head: band and
#      slice pooling were both settled on a patch-14 ViT's 576 tokens at 336, so 121 is a fifth of the
#      spatial support they were fitted against. 196 is the nearest legal size that is not a fifth.
#      Reached with `--train-size` off the 336 px cache exactly as cnx_dense reached 352 — the resample
#      adds no information, and the band, slice count and cache stay byte-identical to the control's.
#   2. `--backbone-lr 4e-4`, not 4e-5. 4e-5 is a ViT ADAPTER rate; it was chosen for DINOv2 and handed to
#      a CNN unexamined, and LR has never been varied on this family at all. ConvNeXtV2's own paper
#      fine-tunes at base 6.25e-4 with layer decay, so 4e-4 is one order above the inherited rate and
#      deliberately BELOW ConvNeXt's published figure, because our corpus is far smaller than ImageNet
#      and a full-trunk rate with no layer decay should sit under a decayed one.
#
# Everything else is `cnx_dense`'s and therefore the control's: 20 slices, band 0.10-0.90, whole-stack,
# max slice pooling, 12 epochs one-cycle, FCMAE-pretrained ConvNeXtV2-base at 87.7M parameters.
#
# BATCH AND MEMORY. `ConvNextV2Model` still does not implement gradient checkpointing, so the full
# activation stack is resident and 448 px costs (448/352)^2 = 1.62x cnx_dense's measured 10.49 GB, or
# ~17 GB at batch 2. That fits, but the card has a co-tenant by arrangement, so this runs at
# `--batch 1 --accumulate 6` for the same effective 6 the control used — ~8.5 GB, leaving the card
# shareable. Batch 1 is safe for this trunk specifically: ConvNeXtV2 normalises with LayerNorm, so no
# statistic depends on the batch dimension. `--vram-gb 16` for the same reason cnx_dense needed it —
# DeviceBudget derives its ceiling from FINAL token count and cannot see that a convolutional trunk's
# memory lives in its early high-resolution stages.
#
# control  cnx_dense = 0.7927 solo, the same trunk on DINOv2's recipe. This is the ONLY comparison that
#          isolates what this arm changes, and it is the one that matters.
#          band_dense = 0.8578 is the recipe's own reference point; base_dense = 0.8512 the seat rival.
# seat     comp/champion.json — priced against the shipped roster with record_mix, card-free, after.
# cost     ~2.5 h at 12 epochs, unknown per-epoch until the smoke prices it.
#
# SMOKE FIRST, NOT OPTIONAL. 448 px is a read size nothing has decoded, so its truncated pixel cache does
# not exist: `python -m kneemri.experiments.arm_check --smoke` writes the sixty-study one under a distinct
# `_first60` filename. It also prices the memory before 2.5 hours are spent discovering it.
#
# PRE-REGISTERED, and this time the branches bind. Floor 0.0062, board resolution 0.0015.
#   CONFIRMS THE STARVATION — solo clears 0.83, i.e. recovers more than half the 0.059 gap to band_dense
#     on two corrections alone. Then cnx_dense's number was a recipe artifact, "encoder diversity is
#     closed" is dead as a claim, and the convolutional family earns a real budget: LR sweep, augmentation
#     strength, schedule, each decomposed against a member that works.
#   THE THESIS LANDS — solo clears 0.83 AND nearest stays under 0.85. That is the strong-and-distant cell,
#     empty since this project began, filled by architecture. Price the seat immediately with record_mix
#     against the champion roster; a seat value over +0.0015 is a submission.
#   PARTIAL — solo lands 0.80-0.83. The trunk responds to its own recipe but is not yet seatable. The
#     reading is that the deficit is real but not all recipe, and the next knob is augmentation strength
#     (never moved on this family) rather than another resolution step.
#   REFUTES THE STARVATION — solo stays under 0.80. Two corrections in the trunk's own favour, both
#     argued from the architecture, and it does not move. THAT is the evidence that would license the
#     sentence cnx_dense's write-up reached for a run too early, and the convolutional family can be set
#     aside on a cost argument with the denominator finally printed next to it. Distance stays true
#     either way; it is quality that this arm is testing.
#
# bead: knee-y59c
#
# THE FOUR MOVED FLAGS, DECLARED. Two are the arm's thesis and two are the memory bill they force; the
# checker cannot tell those apart, so the prose above says which is which and this says only that all four
# were moved on purpose.
# deliberate: --train-size
# deliberate: --backbone-lr
# deliberate: --batch
# deliberate: --accumulate
#
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.

extends = ["_family.toml"]

[data]
train_size = 448

[encoder]
backbone_lr = 0.0004
variant = "cnxbase"

[optim]
accumulate = 6
batch = 1

[run]
vram_gb = 16.0

[meta]
hypothesis = "cnx_own_recipe.sh — ConvNeXt judged on a recipe fitted to ConvNeXt, which has never happened."
bead = "knee-y59c"
status = "done"
out = "cnx_own_recipe_s2026"
