# `ortholarge` on the POOL'S OWN read, because the probe says the trunk is not the problem. `knee-6hfi`.
#
# bead: knee-6hfi, knee-x4yx, knee-440m
#
# WHAT THE PROBE SAYS, measured 2026-09-02 22:22Z with `feature_probe --choose-penalty` (the nested-split
# penalty fix that `knee-x4yx` demanded; every trunk number below is at the penalty it chose inside the
# TRAINING positions, so the holdout stayed held out):
#
#   ortholarge@focal-max   0.8249  (penalty 1.0)      ortholarge@mean_max   0.8170  (penalty 0.1)
#   radnet121@focal-max    0.8197  (penalty 0.003)
#   dinov2-large@focal-max 0.8048  (penalty 30.0)     dinov2-large@mean_max 0.7996  (penalty 10.0)
#   v3large@focal-max      0.8046  (penalty 3.0)      v3large@mean_max      0.7968  (penalty 0.3)
#   vjepa2-large@mean_max  0.7985  (penalty 10.0)     dinov2-small@mean_max 0.7896  (penalty 100.0)
#   orthodiff@gap256       0.7435  (penalty 0.3)
#
# Two things in that table, and only the second one is this arm's.
#
# FIRST, the ordering is not the one the ledger was written on. At the old SHARED penalty of 100 the
# same arrays put dinov2-large ahead of both external trunks; read at each trunk's own penalty
# `ortholarge` leads by +0.020 and `radnet121` by +0.015. Feature magnitudes differ ~17x across these
# trunks, so one ridge term was a mild regulariser for one and annihilation for another. That is
# `knee-x4yx`, it is fixed, and it is not what this arm tests.
#
# SECOND, and this is the arm: `ortholarge` is `v3large` continued on 1.25M knee images and identical
# to it in every other respect. Frozen, at its own penalty, on the same 909 studies, it reads +0.0203
# above v3large at focal-max and +0.0202 at mean_max. The SAME delta on both readouts is what makes it
# a trunk property rather than a pooling artefact: in-domain SSL continuation buys ~0.020 of linearly
# readable signal, measured on the only controlled pair this project can build without spending the
# SSL compute itself.
#
# AND OUR RECIPE IS NOT COLLECTING IT. Every ortholarge member so far was read at 224 px to match
# `base224`: `ortho_lpft_head` (frozen, head only) landed 0.7537 and `ortho_lpft_s2026` opened epoch 0
# at 0.7589. A ridge over the SAME trunk's frozen features reads 0.8170-0.8249. A linear probe is a
# FLOOR, never a ceiling, so a fine-tune sitting 0.06-0.07 BELOW the frozen floor is not a statement
# about the trunk - it is the module docstring's own case: a trunk that probes well and serves badly
# carries signal the recipe is failing to extract, which is a recipe question and a much cheaper one
# than an architecture search.
#
# WHAT THIS CHANGES, and it is one variable. `depth_regions_narrow` is the pool's standard read - 336
# px, 12 slices, band 0.20-0.80, backbone 4e-5, four depth regions, max slice pooling - and it scored
# 0.8554 on a DINOv2 trunk. This arm is that script with `--variant ortholarge` and nothing else moved.
# The 224 px reading is what the probe never used and what every ortholarge member so far was bound by;
# the probe read this trunk at 336 px, and so does this.
#
# control  depth_regions_narrow_s2026 = 0.8554, byte-identical flags, DINOv2 trunk.
#          Second anchor lr4e-5_ws_s2026 = 0.8525, the same recipe without the regions.
# cost     ~3.2 h. A large trunk at 336 px is ~2.25x the pixels of the 224 px ortho arms, which ran
#          432 s an epoch, so ~950 s x 12. Priced against a probe-backed +0.020: the best ratio on the
#          board, and the only lever now open whose mechanism could plausibly reach the 1.5% bar.
#
# WHY THE BATCH IS 4 WITH ACCUMULATE 3, and why that is not a second variable. The first run of this
# arm, at `--batch 12`, took 151 MINUTES for epoch 0 - 9.3x the estimate above, which is otherwise
# sound arithmetic off this trunk's own 224 px number. The gate line explains it: the recipe reserves
# **67549 MiB on a 32607 MiB card**. It did not OOM; on Windows WDDM the allocator spills to host
# memory instead, which reads as 100% GPU at 31735 MiB and roughly a tenth of the throughput. That is
# a MEMORY fault wearing a compute result's clothes, and killing the arm on the wall-clock would have
# retired the probe question without ever testing it.
#
# `--batch 4 --accumulate 3` holds the EFFECTIVE batch at 12, so every number below is still read
# against `depth_regions_narrow_s2026` = 0.8554 with one variable moved. It cuts the reservation to
# roughly a third, which fits, and the expected cost returns to ~970 s an epoch.
#
# The control is `variant: small` at 250 s an epoch. This arm is a LARGE trunk. The pixel ratio was
# never the whole multiplier between them - only between this trunk at 224 px and itself at 336 px.
#
# PRE-REGISTERED against `depth_regions_narrow_s2026` = 0.8554, written before the run:
#
#   s >= 0.8554            THE PROBE TRANSFERS. In-domain SSL continuation is a real trunk lever at the
#              pool's own read, and the 224 px ortho arms were measuring the READ, not the trunk. Every
#              external-trunk decline taken at 224 px is then re-opened by argument, and the next arm is
#              the same swap on the other continued trunks rather than another DINOv2 knob.
#   0.8554 > s >= 0.8492   Inside the 0.0062 floor: the trunk matches DINOv2 on our recipe and its
#              frozen +0.020 does not survive fine-tuning. Still a member on merit (bar 0.8459) and a
#              DISTANT one, so it seats on diversity if it seats at all - but the lever is closed and
#              no further ortholarge arm is armed on this argument.
#   0.8492 > s >= 0.82     The recipe collects part of it. Directional only; keep the checkpoint, do
#              not plan around it, and read the per-label rows before anything else is armed.
#   s < 0.82               The trunk serves badly at 336 px too, i.e. the 0.06 gap to its own frozen
#              floor is NOT a resolution artefact. Then the finding is about FINE-TUNING this trunk at
#              all, the LP-FT triple is the thing that carries it, and the probe's holdout predictions
#              (already emitted under $MODELS/probes) become the only way ortholarge can enter a pool.
#
# WHAT WOULD MAKE ME DISBELIEVE THE RESULT. The recipe line must read `"variant": "ortholarge"` and
# `"image_size": "336"` together - the 224 px value is the one every previous ortholarge arm carried,
# and a flag that did not land would reproduce those numbers exactly and look like a confirmation.
#
# bead: knee-6hfi, knee-x4yx, knee-440m
#
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.

extends = ["_family.toml"]

[encoder]
backbone_lr = 4e-05

[model]
slice_regions = 4

[optim]
accumulate = 3
batch = 4

[meta]
hypothesis = "`ortholarge` on the POOL'S OWN read, because the probe says the trunk is not the problem. `knee-6hfi`."
bead = "knee-6hfi, knee-x4yx, knee-440m"
status = "done"
out = "ortho_pool_read"
