# encoder_adapt.sh — the frozen half of the encoder has never seen a knee. Give it one.
#
# THE PRECONDITION IS MEASURED, NOT ASSUMED, and it is what makes this worth a slot rather than a
# hunch. `kneemri.evaluation.encoder_drift` reports that in every DINOv2 member shipped here, encoder
# blocks 0-5 drift EXACTLY 0.0000 — `--unfreeze-depth 6` freezes them — and the single most-adapted
# block of our best member moved 2.1% of its own norm. Supervision RE-WEIGHTS a natural-image
# representation; it is arithmetically incapable of rebuilding half of one. So the usual objection to
# domain-adaptive pretraining — that the fine-tune simply undoes it — cannot apply to the frozen half:
# whatever self-supervision writes into blocks 0-5 is information the fine-tune has no gradient to
# overwrite. See interpretations/kneemri/2026-08-15_the-encoder-barely-moves.md.
#
# WHAT THE PRETRAINING WAS. `python -m kneemri.training.pretrain --epochs 6 --slices-per-step 96`:
# masked reconstruction over 241,560 cached slices (4,407 studies x 20,130 present slots x 12 slices),
# 60% of patches replaced by the backbone's own mask token, scored as a per-patch-standardised pixel
# MSE PLUS a second MSE on the high-pass filtered spectrum. The cache is the one supervision already
# reads, so no new decode and no second variable.
#
# THE SPECTRAL TERM IS THE HYPOTHESIS, not decoration. A plain pixel MSE is dominated by low
# frequencies — bulk intensity and large smooth structure — which is the half of the image our labels
# are ALREADY good at. Removing the low frequencies before scoring prices exactly the focal detail a
# pixel loss is free to blur away, and focal detail is where the vision/label partition says we fail:
# against 58 fully-annotated studies the model-bottlenecked findings are Lateral Meniscus -0.193,
# ACL -0.123, MCL -0.096, Medial Meniscus -0.094, PF OA -0.086, Lateral OA -0.079 — every one of them
# small and focal.
#
# WHY RECONSTRUCTION AND NOT SELF-DISTILLATION, which is what knee-c5n originally proposed. On 3D brain
# MRI the published ablation puts masked autoencoding with a spectral loss at 0.945 fine-tuned against
# 0.866 for plain MAE, 0.854 for VCR-JEPA and 0.759 for JEPA, and the margin is widest in the FROZEN-
# encoder regime that half our encoder is permanently in. Our own ledger says the same from the other
# side: DINOv3 — strictly better natural-image self-distillation — scored ~0.04 WORSE than DINOv2 here,
# and the deficit was in focal findings. NO WEIGHTS ARE RELEASED for that paper, so only the LOSS is
# replicated, which is also the only part its own ablation credits.
#
# ONE VARIABLE. Byte-identical to the control except `--encoder-weights`. The pretraining read the same
# band (0.10-0.90) and the same cache, so the input distribution is unchanged; what moves is where the
# encoder STARTS.
#
# IT CANNOT LAND SILENTLY, which is why it is written off in Landed rather than compared there.
# `PretrainedEncoder.into` raises on a variant mismatch and on any key the target does not name — the
# exact defect `encoder_drift` met from the other side, where a state dict nothing matched reported a
# drift of 0.000 and that read as "nothing changed" while meaning "nothing was compared". A load that
# did nothing here is an exception, not the control's score wearing the arm's name.
#
# THE FALSIFIABLE PART, written before the run so it cannot be decided afterwards: the gain must
# CONCENTRATE IN THE FOCAL FINDINGS. Medial Meniscus, Lateral Meniscus, ACL, MCL and PF OA are what a
# high-frequency reconstruction objective can plausibly serve; Effusion, Baker's, Contusion and
# Synovitis are large and diffuse, are already the labels we score best, and should barely move.
# A UNIFORM LIFT ACROSS ALL TWELVE REFUTES THE SPECTRAL MECHANISM — it would mean the arm bought a
# generally better initialisation, which is a real result but a DIFFERENT one, and the write-up must
# say so rather than crediting the high-pass term.
# A LIFT CONCENTRATED IN THE DIFFUSE FOUR REFUTES IT OUTRIGHT: those are exactly the frequencies the
# spectral term discards, so a gain there means something other than the stated mechanism moved the
# number and the arm has not tested what it claims to.
# This is the MIRROR of severity_weight's clause, deliberately. That arm predicted the graded regional
# labels and got focal +0.0001 / regional -0.0118 against it. The two clauses cannot both be satisfied
# by the same general effect, which is what makes either of them worth reading.
#
# control  band_dense = 0.8578 (best epoch 8), byte-identical recipe with the flag off.
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.

extends = ["_family.toml"]

[encoder]
encoder_weights = "$MODELS/adapt_small_e6.pt"

[meta]
hypothesis = "encoder_adapt.sh — the frozen half of the encoder has never seen a knee. Give it one."
requires = ["$MODELS/adapt_small_e6.pt"]
status = "queued"
out = "encoder_adapt_s2026"
