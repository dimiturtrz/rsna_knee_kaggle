#
# WHAT IT ASKS. Every foreign-trunk arm this project has run inherits `unfreeze_last 6 / offset 0 /
# layer_decay 1.0`: radiodino_corpus 0.8214, coatnet_hybrid 0.8259, ortho_slow_trunk 0.8265,
