# own merits and the suspicion that hangs over all four rows is retired. Either answer is worth having;
# only one of them is worth more card.
#
# WHY THE LADDER TRANSFERS EXACTLY. mricore is `mricore-vitb` — a ViT-Base, twelve blocks, the same
# depth as the DINOv2-small the ladder was derived on. So the arithmetic is unchanged:
# `StudyModel.parameter_groups` anchors at the TOP opened block, opening twelve re-grades the control's
# own six by a geometric mean of 0.7^2.5 = 0.4100, and the anchor absorbs it at
# 4e-5 / 0.4100 = 9.8e-5. Blocks 6-11 then average the control's flat 4e-5 while blocks 0-5 get the
# whisper. Same derivation, same compensation, different trunk — which is the point.
#
# ONE VARIABLE, AND THE BATCH IS NOT IT. mricore_corpus ran `--batch 2 --accumulate 3`, an effective
# batch of 6, not the 12 that band_dense uses. This arm keeps 2/3 unchanged rather than copying
# band_deep_matched 2/6, because holding the control's effective batch is what makes the ladder the
# only thing that moved. Twelve open blocks under `recompute_activations` cost activation memory
# weakly, so the control's 7.66 GB reserved has room on a card that also serves the other project.
#
