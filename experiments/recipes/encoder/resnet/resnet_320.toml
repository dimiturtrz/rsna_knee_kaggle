# resnet_320.sh — the CNN family at the largest resolution this card will fit without a confound.
#
# bead: knee-7niv7
# reading: resnet_320_s2026.holdout.npz
#
# WHAT THE SHORT ARM SETTLED AND WHAT IT DID NOT. `resnet_224_short` closed at 0.8527 (peak epoch 8 of
# 12, converged) — the first non-transformer member this project owns, and it ties `res392_ws` at 0.8523,
# the best single member on the roster. So the CNN lane is not weak, which was the open belief. What it
# did not settle is whether the family has HEADROOM, and the one budget knob has already been answered
# in the negative: `resnet_224_long` at 48 epochs peaked 0.8404 at epoch 6, BELOW the 12-epoch arm. More
# epochs is not the lever. This arm asks the other one.
#
# RESOLUTION IS THE LEVER. `res392_ws` is a ViT at 392 reading 0.8523;
# `resnet_224_short` is a CNN at 224 reading 0.8527. Neither can be subtracted from the other because
# they differ in BOTH trunk family and input resolution. Fitting the CNN at 392 makes the resolution
# common and leaves the family as the only difference from `resnet_224_short` — which is the quantity the ensemble is actually
# buying. Knee MRI structure is thin and sparse (the mask ladder's whole finding was that hiding 60% of
# a 224 slice destroys routing where hiding 15% does not), so a CNN's local receptive field has more to
# read at 320 than a ViT's global attention does. That is the mechanism, and it is why this is the
# resolution arm rather than a third budget arm.
#
# 320 IS WHERE THE CARD AND THE RECIPE MEET, AND THREE SMOKES FOUND THE EDGES. 392 was refused by the
# TRUNK (`resnet50d is patch 32, which cannot tile a 392 px read`). Batch 1 at 384 was refused by the
# RECIPE: `$RECIPE` carries `--rank-weight 1.0`, a PAIRWISE term, and a batch of one forms no pairs — the
# rank loss would have contributed exactly zero and the arm would have descended the plain recipe under
# its own name, scoring cleanly and answering a different question (`--accumulate` cannot repair it, since
# it sums the gradients of micro-batch losses each computed alone). Batch 2 at 384 was then refused by the
# CARD: `needs 37462 MiB, 30991 MiB free`.
#
# THE ESCAPE THE REFUSAL NAMED IS THE ONE THING THIS ARM MUST NOT USE. `--pair-memory` forms rank pairs
# across steps and would have held 384 at batch 1 — and the ledger prices it at **−0.0302, refuted on the
# mean** (README:345). That is ten times the effect this arm is looking for, pointed the wrong way: the
# resolution reading would arrive buried under a known penalty and be unreadable. So the resolution steps
# down to 320 instead, where batch 2 fits and every other flag stays `resnet_224_short` verbatim. A
# smaller lever, cleanly read, beats a larger one read through a −0.03 confound.
#
# EVERYTHING ELSE IS `resnet_224_short` VERBATIM. Same trunk, same through-plane 2.5D RGB, same max over
# 20 slices, same full-trunk `--unfreeze-last 16`, same 2e-4 single rate, same weight decay 0.05, same
# drop-path (baked on the registry row). One flag moves: `--image-size 320`. A second change would make
# the arm unreadable in the only direction it exists to read.
#
# THE BATCH IS A MEMORY DECISION AND THE BN ARITHMETIC SURVIVES IT. 320 is 2.04x the pixels of 224, and
# the card already refused batch 8 AT 224 (50887 MiB derived against 30991 free), which is why the short
# arm runs batch 4. Batch 2 with `--accumulate 4` holds the effective batch at the recipe's own 8 so the
# optimiser's noise scale is unchanged. BatchNorm sees IMAGES, not studies: at `--slices 20` with
# through-plane a study is 120 images, so batch 2 still gives every BN layer a (240, ...) micro-batch —
# an order of magnitude past the 32-per-worker where Wu & He 2018 (GroupNorm, Fig. 1) show the curve is
# already flat, and nowhere near the 2 where ResNet-50 collapses from ~23.6 to ~35 val error. The smoke
# replaces this paragraph's batch with whatever the card actually derives.
#
# HARNESS CHECK, BEFORE ANY NUMBER IS READ. The printed recipe must name "variant": "resnet50d",
# "image_size": 320, "through_plane": true, "slice_pooling": "max", "slices": 20, "backbone_lr": 0.0002
# and "unfreeze_last": 16. The log's `train mode pins N frozen norm layer(s)` must read **3**, not 36 —
# 36 means the default six-block window is still in force and the arm is fitting a frozen trunk, which
# answers a different question. And the train-mode BatchNorm batch must never read 1 or 2.
#
# PRE-REGISTERED, on the 909 at the ledger cut, against `resnet_224_short` = 0.8527:
#   >= 0.868  resolution is a real lever for this family (+1.5% absolute, the bar). The CNN lane gets a
#             second member AND a direction, and 384 is worth asking on a card with room.
#   0.853-0.868  directional only. Keep the member for its family distance (the 224 arm reads maha 4.654,
#             nearest neighbour 0.8581 against the roster's 0.8956 boundary — DISTINCT, not noisy), do
#             NOT call resolution a finding, and do not queue 384.
#   < 0.853   resolution does not pay for this trunk at this budget. The CNN family closes at 224 with
#             two measurements behind it, and the seat argument rests on family distance alone.
#
# WHY IT IS WORTH THE CARD NOW. Two lanes closed this morning on measured controls — masked latent
# adaptation is worth +0.0014 against `v3small_control` = 0.8371 at mask 0.30 and +0.0007 at 0.60, and
# the 48-epoch CNN budget reads below the 12-epoch one — so the mask ladder, the rate ladder and the long
# CNN arm are all off the card. This is the largest open lever the project has that is not a reseating,
# and the seven board flats were all reseatings within the ViT family.
#
# PRICE: ~1.8 h at 12 epochs (224 measured 264 s/epoch at batch 4; 2.04x the pixels at half the
# batch is roughly 3x the wall-clock per epoch, and the smoke will replace this with a measured number).
# No submission slot. Report the s/epoch WITH the score.
# deliberate: --batch 2 --accumulate 4 (the card derived 37462 MiB at batch 2 against
#             30991 free; --pair-memory is what the batch-1 refusal itself named, and it preserves the
#             resolution under test at the cost of moving where rank pairs are formed)

extends = ["_family.toml"]

[data]
band_high = 0.9
band_low = 0.1
image_size = 320
slices = 20

[encoder]
backbone_lr = 0.0002
head_lr = 0.0002
recompute_activations = true
unfreeze_last = 16
weight_decay = 0.05

[model]
slice_pooling = "max"

[optim]
accumulate = 4
batch = 2
epochs = 12

[meta]
hypothesis = "resnet_320.sh — the CNN family at the largest resolution this card will fit without a confound."
bead = "knee-7niv7"
status = "queued"
out = "resnet_320_s2026"
