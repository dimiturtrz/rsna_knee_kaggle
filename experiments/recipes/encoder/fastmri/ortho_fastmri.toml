# `ortho_dense`'s recipe, unchanged, on a corpus that gained a SECOND SITE. The first arm this project
# has ever run on fastMRI, and the owner's standing ask ("i would be glad if you could use more data -
# ive always been all for that and dont know why it never happened").
#
# WHY IT NEVER HAPPENED, since that was the question. The ingest was already written — `build_fastmri`,
# `fastmri_corpus`, `slots.FASTMRI_SCHEME`, `slots.FASTMRI_MERGED_SCHEME`, a `--scheme fastmri` on
# `build_cache`, and a docstring pricing what a canonical merge would cost — and had never been RUN. No
# `fastmri_findings.csv` existed anywhere on this machine, though a 336/12 decode of the volumes did, so
# the images had been read once and the labels never built. And `MergedCache.positions` raised
# `ValueError: 'COR_FLUID_NOFS' is not in list` on its first invocation, refusing precisely the drop
# `slots.FASTMRI_SLOTS` had argued for in writing. A path documented down to what it costs was
# unrunnable, and nothing said so until something ran it. Both fixed 2026-09-10.
#
# WHAT THE CORPUS IS. 1,173 NYU knee studies with fastMRI+ box annotations, CORONAL proton density, half
# fat-suppressed and half not, spacing READ per exam from the ISMRMRD header rather than argued from
# priors. Licence-wise it is the only merge this project can SHIP: Rijeka is CC BY-NC-ND and Stanford's
# MRNet agreement bars derivatives, while the NYU agreement writes algorithm development in by name.
#
# WHAT IT ACTUALLY SUPERVISES, and this is the honest headline rather than the sales line. Of our twelve
# findings it grades three one-to-one — ACL (101 positive of 1,172), MCL (4), Effusion (142) — and for
# the other nine it supplies NEGATIVES ONLY, because its meniscus and cartilage findings are unsided and
# ours are per-compartment. Every row carries reader confidence 0.28 against Rijeka's double-blind 1.0.
# So this arm adds 588 studies that are mostly a statement of absence, and the hazard is a prior shifted
# toward absent on exactly the findings the corpus cannot locate.
#
# 588 AND NOT 1,172, because the canonical slot axis does not name `COR_FLUID_NOFS`. A study acquired
# without fat suppression fills only that slot, so it arrives black — every pixel zero, every mask flag
# zero — and the first merge put 584 such studies into the table carrying full label rows. Nothing
# downstream excludes them; the lesson available from them is that an empty image means absent, on the
# findings this corpus was brought in for. `MergedCache.drop_unslotted` removes their LABEL rows and
# leaves the arrays as decoded, so an extended-scheme build can still carry them properly later.
# The cache is 5,579 studies; the table this arm trains on is 4,994 — ours 4,406 plus fastMRI 588.
#
# CONTROL: `ortho_dense` 0.8452, the same twelve epochs, the same ortholarge trunk, the same 224/12 read
# at band 0.2-0.8, the same 4e-5. ONE variable moves: `--scheme mergedf` and the table that goes with it.
#
# PRICE. COST: `ortho_lpft_s2026` measured 432 s/epoch at this exact shape; 4,994 studies against 4,407
# is x1.13, so ~490 s/epoch and ~1.6 h of card for twelve epochs. GAIN: `merged3_corpus` measured the
# SITE axis directly — +0.0043 for a second site, -0.0024 for a third — and this trunk has never been on
# a merge, so a second site here is the corner that measured positive. That is a knob-sized number and
# is not sold as more: it is below the house bar, and the arm is justified as the first reading of the
# largest UNMEASURED lever the project owns rather than as a predicted win. P(clears ortho_dense) ~ 0.45;
# P(clears +0.015) ~ 0.15. What makes the hour worth spending is that it prices the whole corpus: a
# positive licenses decoding the rest at 336/20, and a negative with the right per-finding shape names
# loss masking as the fix rather than closing the corpus.
#
# PRE-REGISTERED. The per-finding breakdown is NOT optional here — `fastmri_corpus` says so in writing,
# because an overall flat made of "ACL up, OA down" is a different result from an overall flat made of
# nothing moving, and only the first one tells us what to build next.
#
#   s >= 0.8602   (ortho_dense + 0.015) The data lever is real on this trunk and clears the house bar on
#               its own. Then decode fastMRI at 336/20/0.1-0.9 and merge onto `band_dense`'s cache,
#               which is the strongest trunk this project owns (0.8578).
#   |s - 0.8452| < 0.006   Flat overall, and the breakdown decides what it means. If ACL / MCL /
#               Effusion — the three columns this corpus actually grades — rise while the nine
#               absence-only columns fall, the corpus transfers and the ABSENCE PRIOR is eating the
#               gain; the next arm masks those nine to weight 0.0 rather than declining the corpus.
#               If nothing moves anywhere, one filled slot of six is too little input, which is the
#               ambiguity `slots.FASTMRI_MERGED_SCHEME` pre-registers rather than post-mortems.
#   s <= 0.8392   The absence prior dominates outright. Same masking arm, and it is then the arm that
#               decides whether the corpus is usable at all rather than an optimisation of one that is.
#
# It also earns a seat on diversity alone if it is anywhere near its control: a member trained on a
# second institution is the only kind this pool does not already hold, and the owner's standing rule is
# that a member worth testing in an ensemble need not outperform on its own.
#
# deliberate: --scheme mergedf (the whole arm)
# deliberate: every other flag identical to ortho_dense, so the corpus is the only variable
# reading: ortho_fastmri_s2026.holdout.npz
#
# bead: knee-i3ahx
#
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.

extends = ["_family.toml"]

[run]
labels = "$PROCESSED/labels/mergedf_labels.csv"

[data]
band_high = 0.8
band_low = 0.2
slices = 12

[meta]
hypothesis = "`ortho_dense`'s recipe, unchanged, on a corpus that gained a SECOND SITE. The first arm this project"
bead = "knee-i3ahx"
status = "done"
out = "ortho_fastmri_s2026"
