# swin_calib_dense.sh — the non-DINO trunk has never been read on the recipe that produces seatable members.
#
# WHY THIS ARM EXISTS, and it replaces a worse one. `swin_toprate` (knee-tild) proposed moving the rate
# alone on the base recipe. That arm was repriced to a poor ratio once the seat ruler was read: BOTH of
# this project's non-DINO trunks price negative against the champion roster — `vjepa_warm` -0.0007
# [-0.0016, +0.0002] and `swin_supervised` -0.0012 [-0.0020, -0.0003] — and the MORE distant of the two
# (nearest neighbour 0.8119 against 0.8346) is the one that failed more favourably. Distance is spent. What
# is left is solo quality, and the roster's merit level is 0.8460 against this family's 0.8331 ceiling.
#
# THE CONFOUND THAT MAKES "THIS ARCHITECTURE CANNOT SEAT" UNEARNED. Every member seated on the champion
# roster carries `--calibrated-targets`; neither non-DINO trunk carries it. `swin_supervised` additionally
# ran at `--backbone-lr 1e-4` while every seated member runs 4e-5. So the lane has been read only at a rate
# no seated member uses and without the only measured-positive term the project holds.
#
# WHY THE CALIBRATION TERM IS EXPECTED TO TRANSFER, and it is a corner argument rather than a hope.
# `band_dense_hold` + `--calibrated-targets` = `calib_dense_hold` measured **+0.0061** and produced the best
# offline single member this project owns (0.8634). The same flag measured **-0.0020** on `calib_span`. Its
# sign is a property of the operating point, not of the lever — that is the ledger's own stale-operating-
# point lesson — so the only question that matters is which corner this trunk sits at. `calib_dense_hold`
# ran `--slices 20 --band-low 0.1 --band-high 0.9 --whole-stack`; `swin_supervised` runs the same four.
# It is the DENSE corner, where the flag pays, not the span corner where it inverts.
#
# `--hold-annotations` IS NOT A QUALITY LEVER and is not here for one. It holds 58 studies out of training.
# It is here because knee-9198's standing rule is that a LABEL-SIDE arm reports both rulers, and the gold
# one refuses a checkpoint trained without it (TrainedOnAnnotationsError). `--calibrated-targets` moves the
# target toward the annotation, so this is a label-side arm and the rule binds. The dense-hold pair measured
# the hold itself free, so it costs the comparison nothing. This is NOT the roster retrain knee-9198 forbids
# — that ban is on retraining the SHIPPING ROSTER to make it gold-readable for SELECTION, priced at ~6 x 40
# min for a ruler whose 58-study denominator cannot resolve the differences selection turns on. One new arm
# carrying the flag is the scoring practice that bead explicitly says still stands.
#
# TWO FLAGS MOVE, AND THIS ARM THEREFORE CANNOT ATTRIBUTE. Against `swin_supervised` both the rate and the
# calibration term change, so a gain cannot be split between them and this is deliberately not a knob
# reading. The question asked is the one that is actually open — can a non-DINO trunk reach a seat at all —
# and splitting it into two 3 h arms spends six hours to answer a question whose first half is already
# measured at a matched corner. If it seats, the attribution arm is worth running afterwards and not before.
#
# control  swin_supervised = 0.8331 (converged, peak e6). swin_wholetop is the fixed-discovery control at
#          1e-4 and this arm may NOT be queued before its peak exists, for the same reason swin_toprate
#          could not: a rate arm read against a partial curve is fitted to it.
# cost     ~3 h, priced off swin_wholetop's own epochs (894-923 s after the first). Same blocks train.
# seat     `seat_value --candidates swin_calib_dense_s2026.pt --against greedyseat_v1`, card-free, after.
# rulers   BOTH, per knee-9198: the proxy holdout AUC and `supervision_gap --records <run>.pt` over the 58.
#
# PRE-REGISTERED AGAINST THE ROSTER, not against the control — that is the change this arm makes to how
# the family is judged, and it is the point of the reprice above. 0.8460 is the merit level at which this
# pool has ever added a member on quality; every seated member is above it.
#   SEATS — 0.8460 or above. The lane was a recipe confound and not an architecture ceiling. Price the
#     seat, and on a positive reading mount, build an entry and spend a slot on it.
#   GAINS — 0.8392 to 0.8459. The calibration term transferred at roughly its measured size and it is still
#     not enough. Then the deficit is the trunk's, the +0.0061 is spent, and the family closes for seating
#     with the honest statement that it was read fairly and lost.
#   FLAT — 0.8331 to 0.8391. The term did not transfer to this trunk. The corner argument is refuted for
#     non-DINO backbones specifically, which is worth knowing before any other trunk is tried.
#   COSTS — below 0.8331. The rate correction and the calibration together move it backwards, which would
#     say this trunk wants the recipe it already had and the family is done. Do NOT run a fourth setting.
#
# WHAT NO BRANCH HERE LICENSES: none of them re-open the ConvNeXt pair (knee-uk4f). That re-open was always
# priced off swin_wholetop's delta, which is negative at every epoch, and a result about calibration on a
# Swin does not transfer to a frozen-stage-3 ConvNeXt without its own argument.
#
# bead: knee-csxq
# It supersedes knee-tild in place; the reprice that motivates it is on that bead and in
# experiments/README.md 2026-08-30 ("The non-DINO lane does not seat by distance").
#
# deliberate: --backbone-lr
# deliberate: --calibrated-targets
# deliberate: --hold-annotations
#
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.

extends = ["_family.toml"]

[encoder]
backbone_lr = 4e-05

[run]
vram_gb = 8.0

[targets]
calibrated_targets = true
hold_annotations = true

[meta]
hypothesis = "swin_calib_dense.sh — the non-DINO trunk has never been read on the recipe that produces seatable members."
bead = "knee-csxq"
status = "done"
out = "swin_calib_dense_s2026"
