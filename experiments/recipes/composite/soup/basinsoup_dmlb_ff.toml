# bead: knee-17la8
# unmeasurable: fits --fold -1, so it holds no study back and no ledger row can price it (knee-s8kim).
#               Its base basinsoup_dmlb_k4_s2026 reads 0.9092 ledger75, the highest fold-0 number this
#               project owns. The only ruler is the board row of the entry it feeds.
#
# WHAT THIS ARM IS
#   The _ff operation applied to a SOUP, an order this project has never run. The champion
#   `basinsoup_ff_k4_s2026` is soup-of-ff: children refitted whole-corpus, then averaged. This is
#   average first, then give the average the corpus.
#
# WHY IT IS PICKABLE ONLY NOW
#   Slot 56407707 measured the FOLD PENALTY at 0.002 (fold-0 soup 0.9089 -> board 0.943 against its _ff
#   sibling's 0.945), 2x board resolution. So a fold-0 number ranks board candidates at a -0.002 offset,
#   and the highest fold-0 base on disk became a choosable base rather than an unpriceable one.
#
# deliberate: --epochs 4 --backbone-lr 2e-5 --init-scope all — the values souping measured POSITIVE;
#             basinsoup2 read 8 epochs below the 4-epoch pair. A 24-epoch fit would wash the soup out
#             and cost 3 h to re-run an operation already priced on four bases.
# deliberate: no --distill-weight — the dml_b peer term is already in the soup's weights; a teacher pass
#             would change two variables and cost 25 min of inference.
# deliberate: --fold -1 --ema — the champion's own fit.
# deliberate: --vram-gb 22 --batch 4 --accumulate 3 — the owner's 50-70% cap of 32.6 GB, the same shape
#             the children ran under.
#
# PRICE AND BRANCH live in knee-17la8, which arm_check reads.
#
# CARD. 4 epochs x ~350 s on the full 4,407-study corpus is ~35 min. Nothing else of ours on the card.

extends = ["_family.toml"]

[data]
band_high = 0.9
band_low = 0.1
slices = 24

[encoder]
init_scope = "all"
backbone_lr = 2e-05
init = "$MODELS/basinsoup_dmlb_k4_s2026.pt"
recompute_activations = true
whole_stack = true

[model]
slice_pooling = "labelwise"

[optim]
accumulate = 3
batch = 4
ema = true
epochs = 4
one_cycle = true

[regularisation]
slot_dropout = 0.4

[run]
fold = -1
seed = 601
vram_gb = 22.0

[targets]
calibrated_targets = true
hold_annotations = true
rank_weight = 1.0
weight_floor = true

[meta]
hypothesis = "unmeasurable: fits --fold -1, so it holds no study back and no ledger row can price it (knee-s8kim)."
bead = "knee-17la8"
requires = ["$MODELS/basinsoup_dmlb_k4_s2026.pt"]
status = "done"
out = "basinsoup_dmlb_ff"
