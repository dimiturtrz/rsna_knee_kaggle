# stage after final_ws_ramp in experiments/arms/rampsix.sh

extends = ["_family.toml"]

[data]
band_high = 0.9
band_low = 0.1
slices = 20

[model]
slice_pooling = "max"

[optim]
ema = true
epochs = 12

[run]
fold = -1

[sampling]
sample_alpha = 1.0
sample_ramp = 6
sample_spread = "$PROCESSED/train_spread_honest12.npz"

[targets]
calibrated_targets = true
grade_ladder = true

[meta]
hypothesis = "rampsix — the champion's five own-corpus seats refitted with the curriculum RAMP, and nothing else."
bead = "knee-fxgm"
status = "queued"
out = "grade_ladder_ramp"
