# stage after blend_ws in experiments/arms/blendsix.sh

extends = ["_family.toml"]

[data]
band_high = 0.8
band_low = 0.2
scheme = "merged"
slices = 12

[encoder]
through_plane = true

[model]
slice_pooling = "max"

[optim]
ema = true
epochs = 12

[run]
eval_labels = "$PROCESSED/labels/report_labels_v2.csv"
fold = -1
labels = "$PROCESSED/labels/merged_blend_v1.csv"

[meta]
hypothesis = "blendsix.sh — a roster where EVERY seat saw the blend supervision, not one seat out of six."
bead = "knee-4i3m"
status = "queued"
out = "blend_through"
