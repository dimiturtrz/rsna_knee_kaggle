# stage after final_ws_cf in experiments/arms/calibsix.sh

extends = ["_family.toml"]

[data]
band_high = 0.8
band_low = 0.2
scheme = "merged"
slices = 12

[model]
slice_pooling = "max"

[optim]
epochs = 12

[run]
eval_labels = "$PROCESSED/labels/report_labels_v2.csv"
labels = "$PROCESSED/labels/merged_blend_v1.csv"

[targets]
calibrated_targets = true

[meta]
hypothesis = "calibsix — the champion's five uncalibrated seats, refitted with `--calibrated-targets`."
bead = "knee-1c00"
status = "done"
out = "merged_blend_cf"
