# merged_span_ff.sh — the largest single jump in the 111-member greedy curve, refit blind.
#
# bead: knee-zqn8
#
# WHY THIS MEMBER. `merged_span_cf` is greedy seat TWO of the 111-member curve and the largest single
# jump anywhere in it (0.8634 -> 0.8709, +0.0075). Independently, the champion-shadow swap table run on
# 2026-08-30 after `holdswap_v1` was armed priced it at +0.0017 as a swap for `grade_ladder_s2026`,
# inside the group the proxy cannot separate and above `BOARD_RESOLVABLE = 0.0015`. Two instruments
# built on different questions name the same member.
#
# WHY IT MUST BE REFIT AT ALL. `merged_span_cf` is `--fold 0`. Every candidate the step-2 swap table
# names is fold-0, and there is no blind full-fit of ANY of them on disk — seven `_ff` checkpoints
# exist and none is a candidate. A fold-0 member on a champion-shaped entry is the mistake `greedyseat`
# already paid for, 0.936 against the same champion's 0.944, so the second seat is unreachable without
# this run. The card is otherwise idle overnight; the slot is not spendable until 00:00 UTC.
#
# ONE MOVED FLAG against `merged_span_cf`: the fit. `--fold -1 --ema` in place of fold 0, the same swap
# `calib_dense_hold_ff`, `small_batch6_ff` and `through_dense_cf` already carry. Corpus
# (`merged_blend_v1.csv`), eval ruler, slices, band 0.2-0.8, pooling, rate, epochs and
# `--calibrated-targets` all held.
#
# THIS ARM IS A HEDGE AND SAYS SO. `holdswap_v1` was still PENDING when this was armed, and its four
# pre-registered bands decide whether the single-seat swap axis stays open at all: bands A/B re-pin the
# champion and send the next slot to the second seat, bands C/D close the table and no further slot goes
# to a single-seat swap. If C or D lands, this checkpoint is not a wasted slot — it is an unseated blind
# member of the best-jumping seat in the curve, useful to any whole-corpus roster. Forty-odd minutes of
# otherwise-idle card is the trade taken here, exactly as `calib_dense_hold_ff` took it against
# `fourseat_v1`.
#
# NO HOLDOUT NUMBER WILL EXIST FOR IT, BY CONSTRUCTION. A `--fold -1` member has seen every holdout
# study, so `RecordMix` excludes it and neither `seat_value` nor `decode_entry` can price it. Do not
# enter a holdout score for this member in the ledger; there is none to enter. The parent's 0.8618 is
# the fold-0 number and belongs to the fold-0 member.
#
# HARNESS CHECK. The printed recipe must read `"fold": "-1"`, `"ema": "True"`, `"scheme": "merged"`,
# `merged_blend_v1.csv` on "labels", `report_labels_v2.csv` on "eval_labels", `"slices": "20"` and
# band [0.2, 0.8]. Three runs have entered this ledger as facts about an architecture when they were
# facts about a flag that never landed.
#
# deliberate: --fold
#
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.
# unmeasurable: merged_span_ff refits the largest single jump in the 111-member greedy curve blind. The jump was measured on fold 0; this arm deliberately gives that up for the extra data. Its only ruler is the board row of the entry it feeds, which costs a slot.
#

extends = ["_family.toml"]

[data]
band_high = 0.8
band_low = 0.2
scheme = "merged"
slices = 20

[model]
slice_pooling = "max"

[optim]
ema = true

[run]
eval_labels = "$PROCESSED/labels/report_labels_v2.csv"
fold = -1
labels = "$PROCESSED/labels/merged_blend_v1.csv"

[targets]
calibrated_targets = true

[meta]
hypothesis = "merged_span_ff.sh — the largest single jump in the 111-member greedy curve, refit blind."
bead = "knee-zqn8"
requires = ["$PROCESSED/labels/report_labels_v2.csv"]
status = "done"
out = "merged_span_ff"
