#   spread of the +0.0016 itself. That is the whole reason this is worth an idle card -- it is the only
#   construction on the shelf whose expected value lands within scatter of the bar instead of 0.002
#   below it. Every other open route proposes a new member of a cluster that has boarded 0.943-0.945
#   four times.
#
# PRE-REGISTERED, on ledger75 against the parent's 0.9078 and the 0.0053 paired floor
#   >= 0.9098   the bar is cleared. An _ff refit of THIS soup becomes the next slot with a mechanism
#               behind it rather than a reseating.
#   0.9085-0.9097  the op reproduces on a second base (+0.0007 to +0.0019, matching basinsoup's
#               +0.0016) but the base was too low. The OPERATION is then confirmed twice and the
#               shortfall is the base's, which points the next arm at the base and not at the soup.
#   <= 0.9084   below the floor's worth of gain. Souping does not reproduce off a non-EMA parent, and
#               the top-the-shelf route closes by the record's own stated bar -- which is worth more
#               than another entry inside the cluster.
#
# ZERO SLOTS. Fold 0, so this is priced offline on ledger75 and never on the board. It is decisive in
#   both directions without spending a submission.
#
# deliberate: every flag is `fit_b`'s line (dml_cohort.sh:83-90) byte for byte EXCEPT the five named
#             below, so the twelve ARCHITECTURE and three SPLIT keys `weight_soup` refuses on are
