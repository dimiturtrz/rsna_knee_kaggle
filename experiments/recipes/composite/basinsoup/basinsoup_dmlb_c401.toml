# deliberate: --epochs 4 and --backbone-lr 2e-5, the values basinsoup measured positive and basinsoup2
#             measured the far side of (K=3 0.9075 / K=4 0.9080 at 8 epochs, below the 4-epoch pair).
#             Neither is a knob with a sweep in it here.
# deliberate: --ema on the children, as both earlier basinsoup arms. The parent has none -- `fit_b`
#             ships its best epoch -- which is the one way this differs in KIND from the measured op,
#             and it is the named risk: basinsoup2 found children of a CONVERGED EMA parent all land
#             below it, and a non-EMA parent's basin may be shaped differently.
# deliberate: --seed 401/402/403, fresh, so these are not any earlier trio re-run. With the trunk
