# bead: knee-zrcww
# reading: mergedk_drop40_s2026.holdout.npz
#
# WHAT THIS ARM IS
#   `mergedk_corpus`'s exact line with one flag added: `--slot-dropout 0.40`. Two independent
#   generalisation levers stacked, in a cell nothing has occupied.
#
# WHY THE TWO SHOULD COMPOSE RATHER THAN OVERLAP
#   They act on different axes and neither can reach the other's. `slot_dropout` drops whole SLOTS at
#   train time — its gain is measured CROSS-SITE (+0.0132 at 0.40) and its decode_cost is what prices
#   it, so whatever it buys is about surviving a decode the model did not train under. mergedk adds a
#   second HOSPITAL's patients under the same decode. One lever varies the view of a study, the other
#   varies whose study it is. An arm carrying both asks whether the corpus lever's +0.0039 survives when
#   the model is also forced to stop leaning on any particular slot.
#
# AND THE STACK IS THE INTERESTING CASE PRECISELY BECAUSE mergedk ALONE READ NULL
#   mergedk_corpus 0.8490 against base224_control 0.8451 is +0.0039, inside its own pre-registered
#   +-0.006 null band, and it lands on top of the +0.0043 that `merged3_corpus` measured for a SECOND
#   SITE under sparse human labels. Two different supervisions buying the same +0.004 says the gain is
#   the site and not the labels. What that does NOT settle is whether the extra site is worth more to a
#   model that cannot memorise slot positions — which is this arm.
#
# DOSE IS PINNED, NOT SWEPT
#   0.40 is the operating point knee-yotj8 closed on: the dose curve reads +0.0090 / +0.0132 / +0.0147
#   at 0.25 / 0.40 / 0.55 and decode_cost -0.0214 at 0.55 landed inside the pre-registered saturating
#   band. No dose is being re-asked here; the operating point is imported.
#
# PRE-REGISTRATION (written before the run, against mergedk_corpus_s2026 0.8490)
#   >= +0.012        the levers compose. The corpus lever is worth more under slot dropout than alone,
#                    which re-opens the corpus axis at the dose operating point rather than at 0.0.
#   +0.005 .. +0.012 directional. Keep the member for the pool and re-open nothing.
#   within +-0.005   they do not compose on our holdout. This is the EXPECTED read, because
#                    slot_dropout's own gain is cross-site and holdout909 is not cross-site — the seat
#                    and the board are where it would show.
#   <= -0.012        the two interfere: dropping slots on a corpus whose foreign rows are already
#                    softly labelled removes more signal than either lever adds.
#
# deliberate: --slot-dropout 0.40 — imported operating point, not a swept knob (knee-yotj8).
# deliberate: --image-size 224 — a 336 px merge needs ~43 GB of new array and /d holds 23 GB (knee-rijuv).
#
# control  mergedk_corpus_s2026 for the dropout question, base224_control_s2026 for the corpus question.
#          Both are already on disk at the identical line, so this arm buys a 2x2 and costs one cell.

extends = ["_family.toml"]

[data]
band_high = 0.8
band_low = 0.2
slices = 12
image_size = 224
scheme = "mergedk"

[model]
slice_pooling = "max"

[optim]
epochs = 12

[regularisation]
slot_dropout = 0.4

[run]
labels = "$PROCESSED/labels/mergedk_labels.csv"

[meta]
hypothesis = "`mergedk_corpus`'s exact line with one flag added: `--slot-dropout 0.40`. Two independent"
bead = "knee-zrcww"
requires = ["$PROCESSED/labels/report_labels_v2.csv"]
status = "done"
out = "mergedk_drop40_s2026"
