# knee-s9cr cheap probe: grand.toml's seat (labelwise_dense_drop40_long) on the 224 px / 12-slice / 12-epoch trunk.
# Stacked LAST, so under grand.toml it overrides only horizon and geometry and the pair differs in grand's
# fragments alone (ema, warmup, patience_from_progress, stochastic_depth, ghosting, intensity_aug, mixup,
# scale_jitter, padding_mode, aug_*, hard_*):
#   control  --config base.toml --config probe224.toml
#   grand    --config base.toml --config grand.toml --config probe224.toml

[optim]
epochs = 12

[data]
slices = 12
image_size = 224
band_low = 0.2
band_high = 0.8

[model]
slice_pooling = "labelwise"

[encoder]
whole_stack = true
backbone_lr = 4e-5

[targets]
calibrated_targets = true
hold_annotations = true

[regularisation]
slot_dropout = 0.40
