# tissue224.sh — crop about the TISSUE instead of the image, on the cheap resolution.
#
# WHY THIS ARM EXISTS AT ALL. `TissueCentre` has been in this repo since knee-yrf, is plumbed through six
# call sites, is exposed on every cache CLI as `--centre tissue`, and has NEVER been trained under. Every
# member this project owns crops 130 mm about (height//2, width//2) — the IMAGE centre — on the assumption
# that the technologist framed the joint in the middle.
#
# WHAT MEASUREMENT PUT IT BACK ON THE CARD. `crop_coverage`, run 2026-08-26 over 1,848 series from 400
# studies (its own docstring recorded that the question had never been answered):
#
#   crop          median      p10    worst   series
#   image@130     0.8495   0.7299   0.4537     1822
#   tissue@130    0.8860   0.7576   0.4524     1822
#   image@80      0.4024   0.2795   0.1423     1848
#   tissue@80     0.4175   0.3042   0.0929     1848
#
#   tissue - image at 130 mm: +0.0294 [+0.0276, +0.0312]
#   tissue - image at  80 mm: +0.0233 [+0.0215, +0.0251]
#
# Both intervals exclude zero. That REFUTES crop_coverage's own written prediction, which was that the two
# centres would be near-indistinguishable at 130 mm and separate only at the tight 80 mm extent. The gap is
# present at 130 and is LARGER there. The crop every member was fitted under is dropping ~15% of imaged
# tissue at p10 and ~55% at worst.
#
# control  native224 (ledger 2026-08-25) = 0.8502, at 94 s/epoch and 8.1 GB. SINGLE VARIABLE against it:
#          --centre tissue and nothing else. Same 12 slices, same 0.2/0.8 band, same 130 mm extent, same
#          rate, same 12 epochs. The cache is a different FILE (`224px_12sl_tissue` against `224px_12sl`),
#          verified by --print-key before it was built, so this cannot silently read the control's arrays.
# cost     one 12-epoch fit at 224 px, ~19 min. Zero submission slots. The cache was built on CPU beside
#          another arm and cost no card at all.
#
# PREDICTION, written before the run, against a 0.0062 paired floor.
#   >= 0.8564   tissue-centring is a real lever. It then applies to EVERY member, not to this corner, and
#               justifies rebuilding the 336 cache — which is 99 GB and the reason nobody switched.
#   0.8440-0.8563  flat. Retained tissue does not convert to AUC at 130 mm, where the margin is ~15 mm and
#               only the worst tenth clips. Read it as "the effect is diluted", not "the centre is wrong",
#               and move the question to the 80 mm extent, where crop_coverage says the gap must show.
#   <= 0.8440   tissue-centring HURTS, which is the failure crop_coverage named from the start and could
#               not rule out: the centroid drifts toward the calf, keeping tissue while losing the joint.
#               That would retire the strategy outright and vindicate the image centre.
#
# THE SHARPER READ, AND IT MATTERS MORE THAN THE MEAN. There are TWO mechanisms here, they predict
# OPPOSITE shapes, and an earlier draft of this header pre-registered only the first and would have called
# the second a refutation.
#
#   CLIPPING, a subpopulation claim. The tissue centroid sits a median 7 mm off the image centre, p90
#   18 mm, max 32 mm, against ~15 mm of margin at 130 mm. Only the worst TENTH exceeds the margin and
#   actually loses tissue; nine tenths are untouched. An effect confined to 10% of the corpus moves the
#   mean by about a tenth of its own size, so this mechanism produces a FLAT mean by construction and
#   shows up only in a split.
#
#   COMMON-MODE FRAMING, a corpus-wide claim, and this repo has already measured it. `crop_alignment`
#   found that roughly TWO THIRDS of the raw 9-14 mm displacement is common mode — every study's joint
#   sits off-centre in the same direction, so the residual disagreement between slots is only 5.7 mm p50.
#   A shared offset costs no tissue at all below the margin; what it costs is that the network sees the
#   joint at a consistently wrong place in every frame, spending its centre-field resolution on the
#   coil and the far limb. Tissue-centring corrects that for the WHOLE corpus, including studies that
#   never clipped, and it predicts a gain that is UNIFORM across the offset range.
#
# So the split is still the read, but the verdict table is the other way round from the first draft:
# concentrated in the high-offset decile = CLIPPING, and the fix is a tighter crop. Uniform across all
# offsets = COMMON MODE, which is the mechanism `crop_alignment` actually evidenced and the one
# `alignment_damage` recorded that it "cannot see at all", every study sharing it. Either shape confirms
# a real lever and licenses the 336 rebuild. Only a gain that tracks something ELSE — study difficulty,
# or the labels — refutes, and the control for that is that both members read the SAME studies, so the
# hard-study confound cancels in the per-study difference and cannot manufacture either shape.
#
# THE HARNESS SUSPECT, NAMED IN ADVANCE. The recipe line the run prints must say "centre": "tissue" and
# "image_size": "224", and the log must load the same 4,406 studies and hold out the same 909 that every
# fold-0 row was scored on. Three runs have entered this ledger as facts about a method when they were
# facts about a flag that never landed.
#
# bead: knee-2zbi
# control  native224_s2026 = 0.8502 (declared 2026-09-03 from this header own prose, verified on disk, knee-sgzgc)

extends = ["_family.toml"]

[data]
band_high = 0.8
band_low = 0.2
slices = 12
centre = "tissue"
image_size = 224

[encoder]
backbone_lr = 4e-05

[model]
slice_pooling = "max"

[optim]
epochs = 12

[meta]
hypothesis = "tissue224.sh — crop about the TISSUE instead of the image, on the cheap resolution."
bead = "knee-2zbi"
status = "done"
out = "tissue224_s2026"
