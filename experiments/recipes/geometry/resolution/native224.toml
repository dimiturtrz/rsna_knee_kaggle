# native224.sh — the control's recipe read at the encoder's OWN pretraining resolution, and nothing else moved.
#
# bead: knee-w84q
#
# WHAT MOVES. One flag: `--image-size 224`, which points the trainer at images_224px_12sl.npy. Twelve
# slices, the historic 0.20-0.80 band, whole-stack, 4e-5 — every other number is the control's.
#
# THE MECHANISM. DINOv2 is a patch-14 model pretrained at 224, which is 16x16 = 256 patches. Every
# member this project owns reads at 336: 24x24 = 576 patches, reached by INTERPOLATING the position
# embeddings the encoder was trained with. That interpolation is off-distribution for the trunk, and it
# has been on in every arm since the first one. Nothing has ever measured what it costs, or buys.
#
# WHY THE LEDGER DOES NOT ALREADY ANSWER IT. Three 224 rows exist and all three are DINOv3 — a family
# refuted three ways, running its own recipe. Their own entry says "read size is not the axis: 0.0023
# from 441 patches to 196", and DINOv3 is patch-16, so 224 is not even its native read the way it is
# ours. The canonical DINOv2 dense recipe has never been read anywhere but 336 and 448.
#
# THE EXTERNAL EVIDENCE IS WEAK AND IS WRITTEN DOWN AS WEAK. Discussion 735304 carries "single model
# 0.934 @ 224px ... 0.942 with some tweaks" — but the only SAME-AUTHOR pair in that thread is 0.926 @
# 336 against 0.929 @ 224, a +0.003 that is inside anyone's floor. The strong 224 numbers belong to a
# different competitor with unknown other differences. The forum is why this arm was thought of; it is
# not a delta this arm may be read against.
#
# control  lr4e-5_ws = 0.8525 — same 12 slices, same 0.20-0.80 band, same whole-stack, same 4e-5
#          backbone rate, same twelve epochs, same labels. The ONLY difference is the in-plane read.
#          NOT band_dense (0.8578): that is 20 slices at 0.10-0.90 and would confound geometry with
#          resolution. If this arm wins, the band_dense geometry gets built at 224 and becomes the
#          member; this one is the measurement.
# cost     224 is 2.25x fewer patches than 336, so the step is cheaper, not dearer — about 130 s an
#          epoch against 292, roughly half an hour for twelve. The cache build is CPU-only and ran
#          beside a fitting arm, so it cost no card time at all.
#
# THE BATCH IS DELIBERATELY NOT THE KNOB THAT COLLECTS THE SAVING. The ranking term forms its pairs
# inside the batch, so a bigger batch at 224 would change the loss at the same time as the read, and
# this arm would answer nothing. Twelve, as everywhere else.
#
# THE FALSIFIABLE PART, written before the run.
#   * >= +0.015 over the control. The position-embedding interpolation was costing us on every member
#     on disk, and the whole stack has to be re-read at 224 before anything else is spent.
#   * +0.006 to +0.015. Directional under the house bar, and kept for a different reason: a 224 read is
#     architecturally unlike six 336 reads, so it is a DISTANT member, which is the axis MemberDistance
#     was built to price. Seat it and measure the nearest correlation.
#   * within +/- 0.006. The axis is flat, the interpolation is free, and it closes. This is the default
#     and would be consistent with the ledger's own DINOv3 reading.
#   * <= -0.015. The 576 patches are earning their cost, which retires the "read it natively" idea and
#     also argues the other way — that 448 (ledger has a cache, no dense arm) deserves the next look.
#
# HARNESS CHECK BEFORE READING ANY OF THAT. The recipe line the run prints must say "image_size": "224",
# and the log must load 4,406 studies and hold out 909 — the same holdout every fold-0 row was scored
# on. Three runs have entered this ledger as facts about an architecture when they were facts about a
# flag that never landed.
#
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.

extends = ["_family.toml"]

[optim]
epochs = 12

[data]
band_high = 0.8
band_low = 0.2
slices = 12

[meta]
hypothesis = "native224.sh — the control's recipe read at the encoder's OWN pretraining resolution, and nothing else moved."
bead = "knee-w84q"
status = "done"
out = "native224_s2026"
