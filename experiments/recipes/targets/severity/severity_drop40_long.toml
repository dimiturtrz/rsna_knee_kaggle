# bead: knee-evdfd
# reading: severity_drop40_long_s2026.holdout.npz
#
# WHAT THIS ARM IS
#   `severity_weight`'s byte-identical line with two flags imported: `--slot-dropout 0.40` and
#   `--epochs 12 -> 24`. The objective itself is untouched — no dose, no schedule, no re-derivation.
#   Its matched control is `band_dense_drop40_long`, the same line with `--severity-weight` removed.
#
# WHY THE 12-EPOCH READ MAY NOT BE QUOTED AS A REFUTATION
#   severity_weight read 0.8530 mid / 0.8871 ledger75 against band_dense 0.8578 — a -0.0048 loss that
#   the ledger carries as a fact about the objective. Both sides of that subtraction were fitted at 12
#   epochs with no regulariser, and that harness is now MEASURED to bind: +0.0084 and +0.0088 of
#   holdout on two seated recipes (knee-kiss9), +0.0111 at ledger75 on the matched plain recipe
#   (knee-q1pp0). The corpus lever was written off on exactly this defect and the re-take inverted its
#   sign. An objective is a supervision change, not a capacity change, so it has no special claim to
#   be immune — but neither has it been given the budget to show.
#
# WHY THIS OBJECTIVE AND NOT ANOTHER OF THE TWELVE
#   It is the only one whose mechanism was measured before the run rather than argued: the reader's
#   three YES levels were checked against the 57 fully-annotated studies and the agreement rates are
#   0.378 [0.282,0.474] n=98, 0.688 [0.611,0.764] n=141, 0.958 [0.912,1.004] n=72 — THREE INTERVALS
#   THAT DO NOT OVERLAP. The `__conf` column is constant at 0.95 across all three over all 52,872
#   populated cells, so the loss currently pulls as hard on a mild degeneration as on a complete tear.
#   That is per-study information that reaches the table and dies there, and it is the owner's named
#   "additional objectives" lever rather than a knob.
#
# THE RULER DOES NOT MOVE, and this is inherited verbatim from severity_weight.sh because it is the
#   plumbing trap here: severity is applied to the TRAINING table only. Grading the holdout would
#   change which cells it counts and how much, and the AUC would move by construction.
#   `Supervision.moves_the_ruler` forces the second read.
#
# PRE-REGISTRATION (delta = this arm minus band_dense_drop40_long, ledger75)
#   >= +0.0040   the objective earns a seat once its budget is not the control's. The aux-objective
#                axis RE-OPENS and the other eleven arms are re-priceable against the same control.
#   +0.000..+0.004
#                directional. Keep for the pool, spend no slot.
#   <= 0.000     the objective is dead at full budget and the family CLOSES on a harness that cannot
#                be blamed — the same closure shape the corpus lever took.
#   CONCENTRATION, inherited verbatim and binding on every branch above: the gain must concentrate on
#                the labels a report actually grades — Medial Meniscus, Lateral Meniscus, Medial OA,
#                Lateral OA, PF OA. A UNIFORM lift across all twelve REFUTES the mechanism; it would
#                mean the arm bought a general down-weighting of noisy cells, which `--weight-floor`
#                already prices. A lift concentrated in MCL refutes it too — the label-contest pilot
#                found 0 rulebook errors on MCL in 100 studies.
#   holdout      expected >= 0.8530 (its own 12-epoch peak) by the budget argument.
#   peak         if EITHER arm peaks on its last epoch the budget is still binding at 24 and no verdict
#                may be read off the pair at all.
#
# deliberate: --slot-dropout 0.40 — imported operating point (knee-yotj8), not a swept knob.
# deliberate: --epochs 24 — matched to the control. Not a swept knob.
# deliberate: --severity-weight — the one variable against band_dense_drop40_long.
#
# control  band_dense_drop40_long_s2026, run as a pair with this arm. severity_weight_s2026 and
#          band_dense_s2026 give the same subtraction at 12 epochs, on disk, at no extra run.

extends = ["_family.toml"]

[optim]
epochs = 24

[regularisation]
slot_dropout = 0.4

[targets]
severity_weight = true

[meta]
hypothesis = "`severity_weight`'s byte-identical line with two flags imported: `--slot-dropout 0.40` and"
bead = "knee-evdfd"
status = "done"
out = "severity_drop40_long_s2026"
