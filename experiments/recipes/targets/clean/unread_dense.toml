# unread_dense.sh — teach the 27.3% of supervision that is currently one constant.
#
# 14,445 of 52,872 (study, finding) pairs carry the UNK verdict: the report never named the structure,
# so `report_reader` emits one level for every study in the corpus. Those cells carry no ORDER, and
# order is the whole of what the metric reads. `supervision_gap` measured the consequence on the 58
# annotated studies — labels minus model = -0.0470 [-0.0717, -0.0218], Synovitis 0.687 against 0.794,
# Fracture 0.870 against 0.942. A model fitted on those constants out-reads them.
#
# THE TEACHER IS NOT OURS. `kneemri.evaluation.unread_teacher` writes the score from the PUBLISHED
# pool's out-of-fold arrays (20 checkpoints, 5 folds x 4 seeds, partitioning all 4,407 studies), so
# every cell is scored by a model that did not train on it, corpus-wide, for no card hour. Our own
# member read on its own training cells through a shared trunk would be self-distillation — a
# training-dynamics experiment wearing a label experiment's clothes.
#
# ONE VARIABLE. Score only, never weight: an UNK cell keeps whatever --weight-floor gave it, so this
# changes what the cell pulls toward and not how hard. Mean-preserving inside each finding's UNK block
# (rank taken within the block, band centred on the constant those cells already carry: 0.28
# uncalibrated, half-width 0.20 derived as the nearer gap in MEASURED_AGREEMENT, band [0.08, 0.48]).
# The marginal each head sees is unchanged, so a prevalence shift — the one thing a twelve-head trunk
# transmits between heads — stays out of the arm.
#
# control  band_dense_hold_s2026, proxy 0.8573 / gold 0.8956. SINGLE VARIABLE against it:
#          --unread-targets and nothing else. --hold-annotations is kept so the gold ruler is legal.
# cost     one 12-epoch fit. Measured 380 s/epoch, ~76 min — the header said ~40 before it ran.
#
# RESULT (2026-09-03, converged 12/12, peak e6). Gold-58 paired vs control: +0.0020
# [-0.0155, +0.0200] — INSIDE the interval, the middle branch, a NULL. Proxy agreed (0.8577 vs
# 0.8573) and was pre-registered as uninterpretable, so it carries nothing either way. Both named
# fallbacks are killed by ARITHMETIC rather than run: the --weight-floor variant and the positive-
# supervision_gap restriction each reach FEWER cells than this full application, so each has a lower
# ceiling than the +0.0020 it would have to beat. The label lane closes by exhaustion, on the terms
# this header set before the run.
#
# THE PROXY IS UNINTERPRETABLE HERE, registered before the run rather than argued after it. The report
# holdout scores against report-derived labels, whose UNK cells ARE the constants this treatment
# replaces. On 27.3% of cells the ruler and the treatment disagree by construction, so a proxy DROP is
# the expected reading and is not evidence against the mechanism. Gold-58 via annotated_readings is
# the only valid primary; paired half-width +/-0.015.
#
# BRANCHES (gold delta vs control):
#   >= +0.015          mechanism lives; roster it, and only then consider a slot.
#   within +/-0.015    null on this ruler. Directional only, no slot, and do NOT tune the band — a band
#                      fitted to make the number move is the hack this project's own rules forbid.
#   <= -0.015          refuted FOR THIS APPLICATION. What it does NOT rule out: (a) the weight-side
#                      variant, reaching the same cells through --weight-floor rather than the score,
#                      and (b) restriction to the five findings where supervision_gap is positive
#                      (Synovitis +0.1075, Fracture +0.0715, Lateral Meniscus +0.0522, Baker's
#                      +0.0462), leaving MCL at -0.0692 alone.
#
# PRE-REGISTERED SIZE. Every measured label-lane delta in this project sits between +0.006 and +0.017,
# so the honest prediction is sub-1.5% and this arm does NOT clear the house bar on precedent. What
# argues for it anyway is the only thing different about it: it moves 27.3% of the supervision, where
# every prior label arm moved a value or a weight on cells the reader had already read. A mechanism
# touching a quarter of the training signal is the only label-side thing left that COULD be 1.5%, and
# if it lands at +0.01 like the rest the lane is closed by exhaustion rather than by one more null.
#
# RULER PINNED. The switch moves the ruler, so --eval-labels holds the control's table — without the
# pin the arm scores against a table that moved with it, the defect knee-9198 exists for.
#
# bead: knee-s6s9r
#
# NO --vram-gb: DeviceBudget derives the cap from --slices — 20 slices reserve 28.26 GB.

extends = ["_family.toml"]

[optim]
epochs = 12

[run]
eval_labels = "$PROCESSED/labels/report_labels_v2.csv"

[targets]
hold_annotations = true
unread_targets = "$PROCESSED/labels/unread_teacher_v2.csv"

[meta]
hypothesis = "unread_dense.sh — teach the 27.3% of supervision that is currently one constant."
bead = "knee-s6s9r"
requires = ["$PROCESSED/labels/unread_teacher_v2.csv"]
status = "done"
out = "unread_dense_s2026"
