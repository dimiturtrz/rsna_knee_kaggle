# band_pairmem.sh — what does the batch-1 pair-memory substitution COST? The one variable nobody isolated.
#
# WHY THIS ARM EXISTS. Every ViT-L number this project owns at the shipped operating point (336 px, 20
# slices) was measured under `--batch 1 --accumulate 12 --pair-memory 66`, because a 1024-wide 24-block
# ViT-L at `--batch 12` prices 106144 MiB against a 32 GB card (`ortho_stack.sh:38`). The substitution is
# well argued — accumulation costs no activation memory, and a 66-step memory matches the C(12,2) = 66
# pairs a label that batch 12 forms — but its cost has never been MEASURED, at any trunk size.
#
# That gap is load-bearing right now. `ortho_stack` (0.8417) and `v3large_stack` (0.8277) both name
# `band_dense` = 0.8578 as their control and both call it "identical flags with the incumbent trunk".
# Read from the checkpoint config rather than the header, `band_dense_s2026` carries `variant=small` and
# `pair_memory=0`: the arm passes no `--variant` and `options.py:186` defaults it to SMALL. So each of
# those minus-signs against `band_dense` moves the trunk size AND the pair mechanism at once, and the
# project has been reading a two-variable difference as a trunk verdict.
#
# THE SEPARATION. This is `band_dense`'s exact flag set with the pair-memory substitution added and
# nothing else changed — same SMALL trunk, same 20 slices, same band, same rate, same epochs. The single
# free variable is the mechanism. It fits: the small trunk at batch 1 reserves far less than band_dense's
# measured 27 GB, so the arm that CANNOT be run on a ViT-L can be run here, which is the whole point.
#
# WHAT IT BUYS. `band_dense` − `band_pairmem` is the handicap, priced on a trunk where both sides exist.
# Subtract it from the ViT-L rows and they become readable against a small-trunk control for the first
# time. It does not make them a matched pair — a transfer across trunk sizes is an assumption, and the
# arm header says so rather than pretending otherwise — but it replaces an unmeasured confound with a
# measured one, which is the difference between "suggestive" and "bounded".
#
# BRANCHES, pre-registered, floor 0.0062 on the 909-study holdout:
#   within the floor    the substitution is FREE. Then `ortho_stack` − `band_dense` = −0.0161 really is
#                       the trunk size, the ViT-L lane at this geometry is a straight loss to the small
#                       trunk, and the in-domain question moves to 224/12 where a ViT-L runs unhandicapped.
#   −0.0062 to −0.02    the substitution COSTS, and the ViT-L rows were measured under a handicap of that
#                       size. Their deficit shrinks by it and the lane stays open on the fitted ruler.
#   worse than −0.02    the substitution dominates every ViT-L number the project owns, and no whole-stack
#                       ViT-L row in this ledger means what its header says. The follow-up is the
#                       mechanism (`RankedObjective`'s memory staleness), not any trunk.
#   BETTER by the floor unexpected; would say the ranking term's pair mass is better supplied stale and
#                       cross-step than fresh and within-batch, which is a claim about the OBJECTIVE and
#                       is worth a second point before it is believed.
#
# COST. band_dense's own step time at batch 1 rather than 12; accumulation holds the effective batch, so
# the epoch count and the optimiser path are unchanged. Priced against the 1.5% bar this is an INSTRUMENT,
# not an improvement: its own pre-registration predicts a member no better than band_dense. It earns the
# card because it retires a confound sitting under four rows and licenses re-reading a whole axis.
#
# bead: knee-710gi
# The pair it makes readable is knee-b7a50; the trunk-attribution defect it answers is knee-4joaj.
#
# reading: logs/band_pairmem_ledger.log
#
# deliberate: --batch
# deliberate: --accumulate
# deliberate: --pair-memory
# deliberate: every other flag — they are band_dense's and may not be touched in this arm.
# control  band_dense = 0.8578 (best epoch 8, variant=small, pair_memory=0, read from its checkpoint)

extends = ["_family.toml"]

[data]
band_high = 0.9
band_low = 0.1
slices = 20

[encoder]
backbone_lr = 4e-05

[optim]
accumulate = 12
batch = 1
epochs = 12

[targets]
pair_memory = 66

[meta]
hypothesis = "band_pairmem.sh — what does the batch-1 pair-memory substitution COST? The one variable nobody isolated."
bead = "knee-710gi"
status = "queued"
out = "band_pairmem_s2026"
