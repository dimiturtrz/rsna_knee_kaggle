# teacher_blend: 3 arms moved from experiments/arms (Phase B, knee-ij7lk.1).

extends = []

[data]
band_high = 0.9
band_low = 0.1

[encoder]
backbone_lr = 4e-05
recompute_activations = true
whole_stack = true

[model]
slice_pooling = "labelwise"

[optim]
epochs = 24
one_cycle = true

[regularisation]
slot_dropout = 0.4

[run]
eval_labels = "$PROCESSED/labels/report_labels_v2.csv"

[targets]
calibrated_targets = true
hold_annotations = true
rank_weight = 1.0
weight_floor = true
