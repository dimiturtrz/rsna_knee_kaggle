# elr: 2 arms moved from experiments/arms (Phase B, knee-ij7lk.1).

extends = []

[data]
band_high = 0.9
band_low = 0.1
scheme = "extended"
slices = 20

[encoder]
backbone_lr = 4e-05
recompute_activations = true
whole_stack = true

[model]
slice_pooling = "labelwise"

[optim]
accumulate = 3
batch = 4
epochs = 24
one_cycle = true

[regularisation]
slot_dropout = 0.4

[targets]
calibrated_targets = true
hold_annotation_studies = true
hold_annotations = true
rank_weight = 1.0
weight_floor = true
