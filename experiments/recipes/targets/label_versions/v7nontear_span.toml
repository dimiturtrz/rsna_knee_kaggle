# The non-tear per-column correction, on top of v6tears. One variable from `v6tears_span`: the
# table. Same recipe as `band_span`/`v5blend_span`/`v6tears_span` in every other respect.
#
# THE CHAIN. v5blend -> v6tears (1,379 contested TEAR cells) -> v7nontear (703 contested NON-TEAR
# cells). Each table is one substitution from its predecessor and each arm is one variable from the
# arm before it, so the chain prices each correction separately against a common ruler.
#
# THE TABLE. `report_labels_v7nontear.csv`, built by `research/scripts/build_v7_nontear.py`:
# Contusion WHOLESALE (556 cells) plus the OA family GATED at |cluster_soft - v2_soft| >= 0.6
# (Lateral OA 66, Medial OA 37, PF OA 31, Baker's 13 = 147). 703 rows, 657 studies, 589 of them
# v2=1 over-calls, 698 cells actually changed.
#
# WHY PER COLUMN AND NOT A POOLED MARGIN. D351 measured a margin gradient on 72 adjudicated
# OA-family cells and proposed the 365 corpus cells clearing >= 0.6. Re-cut on all 192 non-tear
# adjudicated cells (M358) that rule is Simpson's paradox: the low-margin stratum is 0.704, not a
# coin flip, and the gradient runs BACKWARD on Contusion - hi 0.780 against lo 0.861 over n=41/79 -
# the column supplying 204 of the 365. The pooled 0.83 was Contusion's 0.833 whole-column base rate
# leaking into an OA statistic through a shared threshold. Reproduced independently by the
# researcher on their own join (D352: Contusion hi 0.780 / lo 0.861, OA-family hi 0.783 / lo 0.294).
# Effusion (n=9) and Synovitis (n=6) are left alone as too thin to bank; the remaining 571
# sub-threshold cells are left alone because the cluster is 0.704 there and 0.704 is not bankable.
#
# THE RESIDUAL-RISK BUDGET, BEFORE THE RUN. ~93 break cells on Contusion at 0.833 and ~32 on the
# gated OA cells at 0.78: roughly 125 wrong cells bought for roughly 578 right ones. An order of
# magnitude looser than v6tears' ~14, which is exactly why this is a SECOND table and a SECOND arm.
#
# THE PRICE. 12 epochs, ~35 min on the 5090. It corrects 703 cells, ~0.25% of the table, against
# v6tears' 1,379. Plausible size if the mechanism carries: smaller than v6tears' and concentrated in
# Contusion, which is one column of twelve. Odds it clears 1.5% on the twelve-column mean ALONE:
# very low. It is queued ahead of `labelwise_depth24` for the same ratio reason v6tears was - that
# arm's own pre-registration predicts flat - and it is the only way to price the 0.833 substitution
# against a model rather than against 120 hand-read cells.
#
# THE RULER, AND THE SAME TRAP. `--eval-labels` stays pinned to v2, so the ledger number is
# comparable to `band_span` 0.8565 and `v6tears_span`. A member trained on a table whose errors it
# was taught NOT to reproduce reads a FLOOR on the v2 ruler by construction. The read is the
# corrected T1 rescore off this run's holdout npz.
#
# PREDICTION, written before the run. On the v2 ruler: at or below `v6tears_span`, with Contusion
# specifically falling - the ruler still holds the 589 over-calls this table removes. On the
# corrected T1 ruler: at or above `v6tears_span`. T1 below `v6tears_span` refutes the per-column
# rule and sends the 703 back, PLUMBING first - assert `labels` names v7nontear and `eval-labels`
# names v2 before writing any number down.
#
# reading: D:/data/volumetric/mri/models/rsna_knee_abnormality/v7nontear_span_s2026*.holdout.npz
# bead: knee-lv4fx

extends = ["_family.toml"]

[model]
