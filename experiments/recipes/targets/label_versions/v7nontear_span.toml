[run]
labels = "$PROCESSED/labels/report_labels_v7nontear.csv"

[data]
slices = 12

[meta]
hypothesis = "The non-tear per-column correction, on top of v6tears. One variable from `v6tears_span`: the"
bead = "knee-lv4fx"
requires = ["$PROCESSED/labels/report_labels_v2.csv"]
status = "done"
out = "v7nontear_span_s2026"
