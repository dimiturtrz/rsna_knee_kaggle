# margin_calib — the strong-and-distant cell, occupied deliberately for the first time.
# bead: knee-myl0
#
# WHY THIS AND NOT A QUALITY ARM. Seat pricing on 2026-08-26 measured the pass-through from solo member
# quality into an ensemble seat at **23%**: `calib_dense_hold`, this project's best offline single ever
# (+0.0056 over `band_dense`), took a seat worth **+0.0013**. In the same run `margin_seat` — solo 0.8525,
# a full **0.0109 WORSE** — took **+0.0018**, the only one of six candidates to clear the +0.0015 bar under
# which this ruler has never been shown to pick a board tick. A worse member bought a bigger seat. That
# reprices the whole member-quality lane (see the 2026-08-26 15:3xZ update in
# `interpretations/kneemri/2026-08-26_what-0950-actually-costs.md`) and points the card here instead.
#
# THE TWO TERMS, AND WHY THEY HAVE NEVER MET. `margin_seat` and `calib_dense_hold` sit on the IDENTICAL
# corner — `--slices 20 --band-low 0.1 --band-high 0.9 --backbone-lr 4e-5 --whole-stack`, 12 epochs — and
# each moves exactly one thing off `band_dense`:
#   `--auc-margin 1.0 --rank-weight 0` buys DISTANCE. Nearest seated neighbour 0.8628 against a seated
#     spread whose top is 0.9248. It is the second most distant candidate we hold, and the most distant
#     one that is not simply broken.
#   `--calibrated-targets` buys QUALITY. +0.0061 at this exact corner, replicated in sign at `calib_span`.
# They are mechanically distinct: one changes what the loss RANKS, the other changes what the targets SAY.
# `2026-08-24_architecture_diversity_is_closed_and_the_empty_cell_is_strong_and_distant.md` states the
# quadrant is empty because **nothing here has ever optimised both terms of the ambiguity decomposition at
# once**. This is that arm.
#
# WHY NOT THE OTHER CONSTRUCTION. That document named two, and the other one has already run and failed:
# `dissent_seat` (negative-correlation training) is the MOST redundant candidate we hold — nearest 0.9292 —
# and seats at **−0.0008**. Decorrelation asked for in the loss produced a twin. The AUC margin, which was
# never asked for diversity at all, produced the distance. Take the one that measured.
#
# PRE-REGISTRATION — read the SEAT first and the SOLO second, which is the whole point of the arm:
#   seat >= +0.0018, nearest <= 0.90   THE CELL IS OCCUPIED. Both terms compose. The next arms are more
#                                      members built this way and the member-quality lane stops.
#   seat >= +0.0015, nearest 0.90-0.93 it seats, but on quality rather than on distance. Directional; keep
#                                      it because it is free, do not plan around it.
#   seat <  +0.0015, nearest >= 0.92   SAME LEVER WEARING TWO NAMES. Calibrated targets and an AUC margin
#                                      both reshape which studies the loss cares about, and the distance
#                                      collapsed. That CLOSES the objective route the way `dissent_seat`
#                                      closed the decorrelation route, and it closes it for ~85 minutes.
#   solo <  0.8525                     SUSPECT THE HARNESS FIRST. Both terms measured positive alone at
#                                      this corner; falling below the weaker of the two is a plumbing shape
#                                      before it is a mechanism. Diff the recorded recipe stamps key by key.
#
# THE ADDITIVE SOLO PREDICTION, stated before the number:
#     predicted = margin_seat + (calib_dense_hold − band_dense_hold) − hold_price
#               = 0.8525 + 0.0061 − 0.0005 = 0.8581
# (`margin_seat` carries no `--hold-annotations`; this arm does, and the hold measured −0.0005 at this
# corner, recipe-independently.) The solo is NOT the decision — it is the sanity check on the seat.
#
# READ IT WITH `python -m kneemri.experiments.convergence_check` BEFORE QUOTING ANYTHING. Under `one_cycle`
# a truncated run never runs the anneal, so its score is a FLOOR, and a seat priced off a floor is a seat
# priced off nothing.
#
# COST: ~85 min of card at 336 px / 20 slices, ZERO submission slots, fold-0 holdout. `--hold-annotations`
# buys the annotation ruler in the same run, so `knee-9198`'s both-rulers rule is satisfied without a
# second one.
#
# deliberate: --auc-margin 1.0 --rank-weight 0 (the distance term; single measured by margin_seat here)
# deliberate: --calibrated-targets (the quality term; single measured by calib_dense_hold here)
# deliberate: --hold-annotations (matches calib_dense_hold and band_dense_hold, and buys the second ruler)
# deliberate: --slices 20 --band-low 0.1 --band-high 0.9 (the corner BOTH controls already sit on)
#
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.

extends = ["_family.toml"]

[data]
band_high = 0.9
band_low = 0.1
slices = 20

[encoder]
backbone_lr = 4e-05

[targets]
rank_weight = 0.0
auc_margin = 1.0
hold_annotations = true

[meta]
hypothesis = "margin_calib — the strong-and-distant cell, occupied deliberately for the first time."
bead = "knee-myl0"
status = "queued"
out = "margin_calib_s2026"
