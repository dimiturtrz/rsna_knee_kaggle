# finding_calib_dense_ff.sh — finding_calib_dense refit on the whole corpus, the second of the two seats
# in the greedy-optimal set that had no full-fit twin.
#
# bead: knee-oizh2
# unmeasurable: --fold -1 holds nothing back, so this member has no holdout score and no ledger row can
#   price it. Its ruler is the board, through the entry that seats it, and nowhere else.
#
# WHY THIS ARM. Same argument as `margin_seat_ff`, on the other unpaired seat. Together with
# `chainfour_ff` they make the best offline set this project owns shippable AT THE CHAMPION'S DOSE, which
# is an entry composition that has never been available: until 2026-09-06 none of its members existed
# dark, so every comparison against the champion mixed a member difference with a dose difference.
#
# EVERY FLAG IS finding_calib_dense's, TWO CHANGED, AND THE CHANGES ARE STATED:
#   --fold -1        replaces the implicit fold 0. This is the whole arm.
#   --out            a distinct file, so the fold-0 member every offline reading is about is untouched.
#
# deliberate: --fold -1 (the arm)
# deliberate: --calibrated-targets --finding-calibration (the member's two supervision terms, unchanged)
# deliberate: --hold-annotations (kept for flag-for-flag identity with the original even though nothing
#   is held under --fold -1)
# deliberate: --slice-pooling max --slices 20 --band-low 0.1 --band-high 0.9 --backbone-lr 4e-5 (the corner, held)
# deliberate: --epochs 12. Under --fold -1 no holdout ranks the epochs, so the epoch INDEX stands in and
#   the budget must match the one whose peak is known.
#
# COST. ~75 min of card, zero slots.
#
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.

extends = ["_family.toml"]

[data]
band_high = 0.9
band_low = 0.1
slices = 20

[encoder]
backbone_lr = 4e-05

[run]
fold = -1

[targets]
finding_calibration = true
hold_annotations = true
rank_weight = 1.0

[meta]
hypothesis = "finding_calib_dense_ff.sh — finding_calib_dense refit on the whole corpus, the second of the two seats"
bead = "knee-oizh2"
status = "queued"
out = "finding_calib_dense_ff"
