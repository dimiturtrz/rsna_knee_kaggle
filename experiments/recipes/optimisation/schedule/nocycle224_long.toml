# nocycle224_long.sh — the 24-epoch cell with `--one-cycle` OFF and nothing else moved. The first test
# of the SCHEDULE as the cause of the late-training decline, after three arms tested the data and failed.
#
# bead: knee-fkw5
#
# WHY THIS SUSPECT, AND WHY IT IS THE LARGEST PRICED LEVER WE HOLD. The project's standing account of
# the peak-to-finish decline (band_dense_long: peak at epoch 6 of 24, -0.0182 to the end, 2.9x the
# 0.0062 floor) is memorisation of the (study, label) pair. Three perturbations aimed squarely at that
# mechanism have now left the quantity invariant, and each one demonstrably FIRED:
#
#   half_data   halved the training studies                  decline -0.0169 against control -0.0182
#   aug_long    intensity block on, train loss up every       decline -0.0169 against control -0.0182
#               epoch past 4
#   mixup224    convex blend of the pair, a=0.2 and a=0.4,    holdout flat inside a THIRD of the floor
#               final train loss 0.6066 -> 0.7369 -> 0.7908
#
# A quantity that survives halving the dataset, changing the appearance, AND convexly mixing the pair is
# not plausibly memorisation of that pair. What none of the three varied is the LEARNING-RATE SCHEDULE:
# `one_cycle` is True in every recipe in this ledger, because it lives in $RECIPE and no arm has ever
# spelled the recipe out to drop it.
#
# THE MECHANISM THIS ARM PROPOSES, stated so it can be wrong. Under one_cycle the LR at epoch 6 (near
# the peak of the cycle) and at epoch 23 (deep in the anneal) differ by orders of magnitude. A collapsing
# LR drives the weights into a sharper minimum of the TRAIN objective, which is exactly the observed
# description -- "train loss halved while holdout slid" -- with no memorisation required. On that account
# the decline is not the model learning the corpus by heart; it is the anneal converting a flat solution
# into a sharp one, and the peak at epoch 6 is where the cycle's LR was best matched to the problem.
#
# WHY --one-cycle IS DROPPED BY SPELLING $RECIPE OUT. $RECIPE is "--fold 0 --one-cycle --weight-floor
# --rank-weight 1.0" (experiments/recipe.sh:23). There is no negating flag, so this arm passes the other
# three by hand. That is the single deviation and it is the arm's whole thesis; every other key must
# match native224_long exactly, and the printed recipe is where that is checked rather than assumed.
#
# WHAT THIS ARM IS NOT. It is not a bid for a better member and its HEIGHT is not the reading. A constant
# 4e-5 for 24 epochs may well score below the annealed control -- one_cycle is in the recipe because it
# won on score, and nothing here disputes that. The reading is the SHAPE: whether the peak-to-finish
# decline survives when the anneal is removed.
#
# PRE-REGISTERED READINGS, written before the run and read against native224_long as the control:
#   SCHEDULE      the control declines >= 2x floor and this arm's decline is smaller than the control's
#                 by more than the floor. The decline is then substantially an artefact of the anneal,
#                 the memorisation account is refuted on four perturbations, and the lever is a schedule
#                 change worth up to the size of the decline. This is the outcome worth the card.
#   NOT SCHEDULE  both decline by the same amount within the floor. The anneal is exonerated, and with
#                 data and schedule both cleared the suspect moves to REPRESENTATION (knee-jk3, the
#                 0.044 generalisation gap at matched train loss) -- a much more expensive lane, which is
#                 worth knowing before it is entered.
#   NO DISEASE    the control does not decline at 224 at all. This arm is then uninterpretable and should
#                 not have been run; that is why it is gated on the control rather than launched beside
#                 it.
#   A peak on the LAST epoch means the budget bound the run (convergence_check UNDERTRAINED) and the
#   decline question was not answered. Without an anneal that is a live risk, and it is a real outcome
#   rather than a failure -- say so plainly instead of reading the height.
#
# control  native224_long (24 epochs, one_cycle ON), running now. The single variable is --one-cycle.
# cost     ~41 min at ~102 s an epoch, matching the control's measured rate.
#
# HARNESS CHECK BEFORE READING ANY NUMBER. The printed recipe must say "one_cycle": "False",
# "epochs": "24", "image_size": "224", "mixup": "0.0", and the log must load 4,406 studies and hold out
# 909. one_cycle reading True here would make this arm a duplicate of its own control.
#
# deliberate: --one-cycle OMITTED (the arm's thesis; $RECIPE spelled out without it)
# deliberate: --epochs 24 (the budget the decline was measured over)
# deliberate: --image-size 224 (native224's control, per that row's standing instruction)
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.

extends = ["_family.toml"]

[data]
band_high = 0.8
band_low = 0.2
slices = 12
image_size = 224

[encoder]
recompute_activations = true
whole_stack = true

[model]
slice_pooling = "max"

[optim]
epochs = 24

[run]
fold = 0

[meta]
hypothesis = "nocycle224_long.sh — the 24-epoch cell with `--one-cycle` OFF and nothing else moved. The first test"
bead = "knee-fkw5"
status = "queued"
out = "nocycle224_long_s2026"
