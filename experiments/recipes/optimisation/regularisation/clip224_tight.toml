# clip224_tight.sh — native224's recipe with `--grad-clip 0.5`. The second point on the clipping dose
# axis, and the one that is allowed to bind on the ORDINARY step rather than only on the tail.
#
# bead: knee-s9cr
#
# WHY A SECOND POINT AT ALL, AND WHY IT IS NOT A SWEEP. Clipping has no effect until the ceiling is
# below the gradients the run actually produces, and this project has never measured its gradient norms
# — so a single value is a coin toss on an unknown scale, and one point cannot distinguish "clipping
# does not help" from "1.0 never bound". Two points that differ by 2x separate those: if 1.0 reads flat
# and 0.5 moves the number in EITHER direction, the ceiling was above the run's norms at 1.0 and the
# flat reading was about the value, not about the mechanism. That is the whole argument for this arm,
# and it is why it is priced as an instrument rather than as an improvement.
#
# THE MECHANISM, SHARPER THAN clip224's. At 1.0 clipping is meant to touch only the outlier batch. At
# 0.5 it plausibly touches a large share of steps, and a ceiling that binds most of the time is no
# longer a variance control: it is a per-step learning-rate cut that grows as the gradient grows, which
# is a DIFFERENT method — closer to normalised-gradient descent than to a safety rail. That is a real
# mechanism with its own literature and it can win, but it must be read as its own thing: a gain here
# with a flat 1.0 is not "clipping helps", it is "the effective rate at 4e-5 is too high late in the
# run", and the follow-up is then the rate schedule, not the ceiling.
#
# WHAT THE PAIR CAN SAY, written before either runs.
#   both flat            the ceiling never bound; our gradients live below 0.5 and clipping is closed at
#                        224 without another value being tried.
#   1.0 flat, 0.5 moves  the norms sit between; whichever direction 0.5 moves is a statement about the
#                        effective step size, and the family continues on the rate rather than the clip.
#   both positive        genuine variance control, and 1.0's reading is the one to ship, since it is the
#                        weaker intervention.
#   1.0 positive, 0.5 down  the tail is what mattered and the ordinary step must not be touched. The
#                        cleanest possible reading, and it is the one the mechanism predicts.
#
# control  native224 = 0.8502, best at epoch 7, converged not truncated. Same twelve-epoch recipe, same
#          909-study holdout, unbounded steps. The single variable is --grad-clip. Read against the
#          control FIRST and against clip224 second — the pair is the instrument, the delta is the arm.
# cost     ~19 min for twelve epochs at 94 s. Same cache as native224; one norm per optimiser step.
# price    19 min for P(clears the 0.0062 floor on the MEAN) = 0.12, lower than clip224's 0.20 because
#          the value is deliberately aggressive. Bought for what the PAIR settles, not for the number.
#          Queue it after clip224 rather than beside it, and drop it if clip224 clears the floor — a
#          confirmed weak ceiling makes the strong one a tuning question, and tuning is not this
#          window's business.
#
# HARNESS CHECK BEFORE READING ANY NUMBER. The printed recipe must say "grad_clip": "0.5" and
# "image_size": "224", 4,406 studies loaded and 909 held out. The landed check compares the trainer's
# `gradient_clip_norm` against the flag, so an unlanded value refuses rather than reproducing the
# control's number under this arm's name.
#
# THE FALSIFIABLE PART, written before the run.
#   CONFIRMED   the mean peak clears 0.8564. Read with clip224 per the table above before it is called
#               a clipping result rather than a rate result.
#   DIRECTIONAL positive under the floor. Kept only if clip224 is also positive; a lone directional at
#               the aggressive value is more likely the rate axis and belongs there.
#   FLAT        with clip224 also flat: clipping is CLOSED at 224 for this recipe, and the late slide
#               `native224_long` measured is not step size. That is the instrument paying out.
#   REFUTED     the mean falls by more than the floor. The ceiling binds on ordinary steps and costs
#               real fitting; that bounds our gradient norms from BELOW, which is the first quantitative
#               thing this project would know about them.
#
# deliberate: --grad-clip 0.5 (the arm's thesis — a ceiling low enough to bind on the ordinary step)
# deliberate: --image-size 224 (native224's control, per that row's standing instruction)
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.

extends = ["_family.toml"]

[data]
image_size = 224

[optim]
grad_clip = 0.5

[meta]
hypothesis = "clip224_tight.sh — native224's recipe with `--grad-clip 0.5`. The second point on the clipping dose"
bead = "knee-s9cr"
status = "done"
out = "clip224_tight_s2026"
