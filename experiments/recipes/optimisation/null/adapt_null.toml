# adapt_null.sh — the control four collapsed arms were read without.
# bead: knee-dck5
#
# WHAT THIS ARM IS. `encoder_adapt`, `encoder_adapt_gentle`, `encoder_adapt_lower` and
# `encoder_adapt_thawed` scored 0.6902, 0.6875, 0.7309 and 0.7162 against `band_dense` 0.8578, and every
# write-up attributes the loss to the adaptation. Each of them differs from the control by TWO things at
# once — the weights are adapted, AND they arrive through `--encoder-weights` instead of through the
# registry. Nothing has ever separated those. This arm holds the second and removes the first: the flag
# is on, and what it loads is stock DINOv2-small.
#
# THE MAGNITUDE ARGUMENT IS WHY IT IS WORTH A SLOT, and it is the part the ledger does not make.
# `encoder_adapt` ran the MAE at lr 1e-4 and moved blocks 0-5 by 3.4-8.3% of their own norms.
# `encoder_adapt_gentle` ran the identical objective at 1e-5 and moved the same blocks by 0.46-1.79% — a
# four-fold smaller perturbation, inside the range supervision itself works in. The two scores are 0.6902
# and 0.6875: a 0.0027 gap, under half the 0.0062 noise floor. A four-fold change in the size of the
# damage bought no change in the cost. Representational damage does not behave that way; a constant does.
# The constant is whatever both runs share, and what they share is this load path and the preprocessing
# on either side of it.
#
# THE NULL IS CONSTRUCTED, NOT ASSUMED, and it is checked before it is used. `pretrain.py --epochs 1
# --max-steps 1 --lr 0` writes stock weights through the pretrainer's own `save`, because AdamW's update
# and its decoupled weight decay are both scaled by the rate, so a zero-rate step is the identity.
# `kneemri.evaluation.encoder_drift` then reads the result at 0.0000 on the stem and all twelve blocks —
# which confirms the null AND validates the drift instrument against a known zero, the reading every
# gate on this axis has been steered by and none of it had a negative control for.
#
# THE TWO OUTCOMES, and both are worth the card because they point opposite ways.
#
#   TRACKS THE CONTROL (~0.82 by epoch 3, ~0.8578 at its best): the load path is clean and carries no
#   cost of its own. The four collapses are then real evidence about on-domain SSL, the attribution in
#   the ledger stands as written, and the axis is closed by measurement rather than by suspicion.
#
#   COLLAPSES (~0.63 by epoch 3, floor near the control's epoch-ZERO training loss): the flag costs
#   ~0.17 with NOTHING adapted, and all four arms are void — they measured this, not the adaptation.
#   The only axis left with a mechanism above 1.5% reopens, and it reopens with a named bug to fix
#   rather than a hypothesis to re-argue.
#
# WHAT IT CANNOT DO IS RAISE THE SCORE. It is an instrument and it is priced as one: ~25 minutes of card
# to decide whether four arms and the interpretation built on them are about the idea or about us.
#
# THE TRAINING LOSS IS THE READING, not just the AUC. All three encoder arms floored near `band_dense`'s
# epoch-ZERO loss (1.1978, 1.1960, 1.1073 against a control running 1.2162 -> 0.5780) — they were not
# fitting worse, they were barely fitting. Four epochs is enough to see which curve this one is on.
#
# FOUR EPOCHS, not twelve, deliberately. The separation being read is ~0.19 at epoch 3 (control 0.8232,
# collapsed arms ~0.63), thirty times the noise floor, so the answer arrives long before convergence
# does and a best-epoch number would buy nothing this question needs.
#
# control  band_dense = 0.8578 (best epoch 8); epoch-by-epoch 0.7625-era curve in experiments/README.md.
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.

extends = ["_family.toml"]

[data]
band_high = 0.9
band_low = 0.1
slices = 20

[encoder]
backbone_lr = 4e-05
encoder_weights = "$MODELS/adapt_null.pt"
recompute_activations = true
whole_stack = true

[model]
slice_pooling = "max"

[optim]
epochs = 4
one_cycle = true

[targets]
rank_weight = 1.0
weight_floor = true

[meta]
hypothesis = "adapt_null.sh — the control four collapsed arms were read without."
bead = "knee-dck5"
requires = ["$MODELS/adapt_null.pt"]
status = "queued"
out = "adapt_null_s2026"
