# headlr224.sh — native224's recipe with `--head-lr 5e-3` and nothing else moved. The FAST point of a
# dose pair; `headlr224_slow.sh` is the slow point at 2e-4.
#
# bead: knee-s9cr
#
# THE AXIS IS NEVER-VARIED AND THE AUDIT IS WHY THIS IS BEING SAID OUT LOUD. `--head-lr` appears in
# exactly one committed arm — `experiments/arms/headlr_dense.sh:57` — and that arm HAS NEVER RUN: its
# name does not occur once in `experiments/README.md`, and `kneemri/experiments/switch_coverage.py:50-57`
# carries `head_lr` in COVERAGE, the dict for "switches no arm selects", whose docstring records it as
# one of five that were "landed-checked, stamped, and never once RUN". The ledger's claim that the knob
# space is "CLOSED BY MEASUREMENT ... sixty-one keys, every one varied at least once"
# (`experiments/README.md:5005-5021`) is true of the FLAG SURFACE — `armed()` scrapes `--flag` tokens out
# of `experiments/**/*.sh` (`switch_coverage.py:79-81`) — and head_lr is counted covered because a script
# exists that mentions it. There is no number. This arm produces the first one.
#
# THE MECHANISM, and it is a constant nobody re-derived when the thing it was pinned to moved.
# `Adaptation` (`kneemri/training/trainer.py:55-69`) sets `head_lr = 1e-3` and `backbone_lr = 8e-6`, and
# its docstring states the design explicitly: "The head is random at initialisation and has everything to
# learn; the encoder starts from a good solution and needs only to be moved off it. That argument sets
# the 125:1 default ratio, and it was inherited from the reference rather than measured." Every arm in
# this ledger since `rate_isolate` then raised the BACKBONE rate five-fold to 4e-5 and left the head at
# its inherited 1e-3. The ratio the design argument is about is therefore no longer 125:1 — it is 25:1,
# and it got there as a SIDE EFFECT of a rate sweep that was reading a different question. `rate_isolate`
# (+0.0051), `rate_1e-4` (0.8490) and `rate_2e-4` (0.7391) between them mapped the backbone rate to its
# collapse edge; not one of them moved the head, so all three read a moving trunk against a head whose
# relative speed was silently falling. `--head-lr 5e-3` restores 125:1 at the settled backbone rate.
#
# WHY THIS IS NOT COVERED BY THE 224 CLOSURE. `mixup224_long` (README:4178-4215) closed a family with a
# mechanism: "Every axis that perturbs how the SAME supervision is presented to the SAME encoder now
# reads flat" — mixup, intensity augmentation, schedule shape, example count. That sentence is about
# PRESENTATION. This arm changes neither the supervision nor the encoder nor how either is presented; it
# changes which point in weight space the same optimiser walks to. The optimiser path is the one axis
# family that closure does not reach, and it is where the never-varied keys are concentrated: weight
# decay (`trainer.py:49`, a module constant), warmup fraction (`trainer.py:81`), the optimiser itself
# (`trainer.py:127`, AdamW, no alternative), and gradient clipping (absent from the tree entirely) have
# no CLI flag at all and cannot be armed without a trainer change. `--head-lr` can, today.
#
# WHY 224 AND NOT headlr_dense's 336. `native224` read the in-plane axis FLAT (0.8502 against
# `lr4e-5_ws` 0.8525, −0.0023 on a 0.0062 floor) at 94 s an epoch against 290, and that row's standing
# instruction is that every matched comparison from here runs at 224. Nineteen minutes buys the dose
# PAIR that forty-five would have bought one point of. `headlr_dense.sh` stays on disk: if 224 reads a
# move, the 336 point is the transport check, and if it reads flat the axis is closed for a third of the
# card either arm would have cost.
#
# control  native224 = 0.8502, best at epoch 7, converged not truncated. 12 epochs, 12 slices, 0.20-0.80
#          band, whole-stack, backbone 4e-5, 224 px, same labels, same 909-study holdout, head at the
#          default 1e-3. The single variable is --head-lr.
# cost     ~19 min for twelve epochs at 94 s, ~8124 MiB reserved — a quarter of the card, so it can share
#          with a peer's job rather than demand one.
# price    19 min for P(clears the 0.0062 floor) = 0.30. Higher than a regulariser dose because the two
#          nearest measurements on the SAME optimiser axis both moved past the floor in opposite
#          directions (rate 8e-6 → 4e-5 = +0.0051; 4e-5 → 2e-4 = −0.1066), so this axis is demonstrably
#          not flat somewhere. It is a 0.30 rather than higher because the head is small and randomly
#          initialised, and a small module's rate is the classic knob that self-corrects within an epoch.
#
# HARNESS CHECK BEFORE READING ANY NUMBER. The printed recipe must say "head_lr": 0.005 and
# "image_size": "224", and the log must load 4,406 studies and hold out 909. `--head-lr` defaults to
# 1e-3, so a flag that never reached the trainer produces a run byte-identical to the control — a delta
# of exactly 0.0000 is a PLUMBING verdict, not a null.
#
# THE FALSIFIABLE PART, written before the run, READ AS A PAIR with headlr224_slow.
#   CONFIRMED   the peak clears 0.8564 (control + floor) AND the slow point at 2e-4 does not. A one-sided
#               response on a rate axis is what a real operating-point miss looks like, and it licenses
#               re-fitting the head rate for every 224 member the roster ships.
#   DIRECTIONAL positive under the floor with the slow point at or below the control. Kept as free and
#               mechanism-sound; not a finding, not planned around, no confirmation seed.
#   REFUTED     the peak falls by more than the floor. 125:1 was inherited from a reference at a
#               different trunk rate, and a head five times faster than the trunk can absorb is a real
#               way to lose — this outcome says the 25:1 the ledger drifted into is not an accident that
#               needs correcting but an operating point the rate sweep implicitly selected.
#   BOTH POINTS FLAT, which is the modal outcome and the one that pays. Two points spanning a 25x range
#               of head rate, both inside the floor, closes the head/backbone RATIO with a measurement
#               rather than with `switch_coverage`'s survey — and that is the claim README:5019 is
#               currently making on this key without a number behind it.
#
# deliberate: --head-lr 5e-3 (the arm's thesis — 125:1 restored at the settled backbone rate)
# deliberate: --image-size 224 (native224's control, per that row's standing instruction)
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.

extends = ["_family.toml"]

[data]
image_size = 224

[encoder]
backbone_lr = 4e-05
head_lr = 0.005

[model]
slice_pooling = "max"

[optim]
epochs = 12

[meta]
hypothesis = "headlr224.sh — native224's recipe with `--head-lr 5e-3` and nothing else moved. The FAST point of a"
bead = "knee-s9cr"
status = "queued"
out = "headlr224_s2026"
