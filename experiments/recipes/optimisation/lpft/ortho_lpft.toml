# stage after ortho_lpft_head in experiments/arms/ortho_lpft.sh

extends = ["_family.toml"]

[data]
band_high = 0.8
band_low = 0.2
image_size = 224
slices = 12

[encoder]
backbone_lr = 1e-05
init = "$MODELS/ortho_lpft_head.pt"
variant = "ortholarge"
whole_stack = true

[meta]
hypothesis = "The same trunk as `ortho_dense`, reached in TWO stages instead of one. `knee-6hfi`."
bead = "knee-6hfi"
status = "queued"
out = "ortho_lpft_s2026"
