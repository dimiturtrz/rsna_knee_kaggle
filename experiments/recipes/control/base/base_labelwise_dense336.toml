# base_labelwise_dense336.sh — the validated trunk at the corner we actually ship at.
#
# bead: knee-olsf8
# reading: base_labelwise_dense336_s2026.holdout.npz
#
# WHAT WAS WRONG WITH THE NIGHT BEFORE THIS ARM. `base_labelwise336` OOMed twice and the 336 corner was
# written down as barred by the machine. It was not: `--recompute-activations` (`adaptation.py:248`,
# default False) was absent from that arm, and `encoder_surgery.py:470-495` measures gradient
# checkpointing on THIS workload at 19% of throughput for nearly all of the encoder's activation memory.
# Twenty-five arms already pass it, `base_dense` and `base_champion` among them. The flag changes NOTHING
# about the experiment — same batch, same loss, and in particular the same 66 within-batch pairs the
# `--rank-weight` term scores, which is exactly why that docstring chose it over splitting the batch. The
# crash was a missing flag, not a boundary.
#
# WHY THE SHIPPING CORNER AND NOT MORE 224 WORK. Every 224 arm this project owns lands 0.88-0.89 —
# `base_labelwise224` 0.8899, `labelwise224` 0.8832, `focal_labelwise224` 0.8796 — all BELOW the best solo
# it owns, `labelwise_dense_drop40_long36` at 0.9030. 224 is an instrument corner. The deliverable is a
# single solo checkpoint, so an arm that cannot reach the shipping corner cannot compete however clean it
# reads.
#
# ONE VARIABLE against `labelwise_dense`: `--variant base`. Same 336 px, same 20 slices, same 0.1-0.9
# band, same `--calibrated-targets --hold-annotations`, same batch. The control is free and on disk at
# 0.8964 ledger75, epoch 7 of 12, 909 studies, and the 336px/20sl/0.1-0.9 array is the plain-named one
# that control already reads — no decode, no `--scheme`.
#
# MECHANISM. Capacity measured +0.0067 under a labelwise head at 224/12sl (knee-ss5rd, converged, above
# the 0.0062 paired floor), which disowned three `rank24` rows that had read it flat on a max head. That
# says the mechanism is live. This asks whether it COMPOSES with the resolution and depth the family
# ships at, and the reason to expect more rather than less is that a 768-wide trunk has more tokens to
# spend at 336/20sl (577 per slice, twenty slices) than at 224/12sl — width pays where there is something
# to be wide about. The competing outcome is that the wider trunk overfits 909 studies harder at the
# higher token count, which is what `--slot-dropout` exists for and is the next arm rather than this one.
#
# PRICE, out loud. `base_labelwise224_dense` runs 171 s/epoch at 224/12sl. 2.25x the pixels and 1.67x the
# slices is 3.75x, and the measured checkpointing tax is 1.23x, so ~790 s/epoch and ~2.6 h for 12 epochs.
# Zero decode, zero submission slots, control free. P(clears 0.9026) ~ 0.35. P(clears the 1.5% bar) ~ 0.10.
# This is the CHEAP PROXY that gates the expensive commit: the 36-epoch `--slot-dropout 0.40` version at
# this corner is ~7.8 h and is the actual shot at a solo above 0.9030.
#
# BANDS, pre-registered, ledger75, against labelwise_dense 0.8964.
#   * >= 0.9026  capacity composes with the shipping corner. The next arm is this recipe at
#                `--epochs 36 --slot-dropout 0.40`, priced at ~7.8 h, and that is the solo deliverable.
#   * 0.8964-0.9026  directional. Keep nothing, compose nothing — and note that the 224 pair read +0.0067,
#                so a smaller delta here is capacity paying LESS at the higher corner, which is itself the
#                answer to the composition question and re-points the remaining card at the schedule axis
#                on the small trunk.
#   * <  0.8964  capacity REVERSES at the shipping corner. That is an overfitting verdict on 909 studies
#                rather than a refutation of width, and the re-test is this arm plus `--slot-dropout 0.40`,
#                not a retreat to 224.
#
# READ THE FOCAL LABELS, NOT ONLY THE MEAN. Lateral Meniscus -0.1925, ACL -0.1225, MCL -0.0964 lead the
# model-side error census. A capacity change that moves the mean without moving those is not this
# mechanism. Say so.
#
# HARNESS CHECK. The printed recipe must name "variant": "base" AND "image_size": "336" AND "slices": "20"
# AND "slice_pooling": "labelwise" AND "calibrated_targets": "True" AND recompute_activations TRUE. That
# last one is the whole point of the arm: if it does not land, this is `base_labelwise336` again and it
# will OOM the same way.
#
# control  labelwise_dense_s2026 = 0.8964 ledger75 @ epoch 7, 909 studies. No control run is owed.
#
# deliberate: --variant base (the arm's thesis)
# deliberate: --recompute-activations — the enabling flag, not a second variable. Measured here at 19%
#             throughput for nearly all of the encoder's activation memory, same batch, same 66 pairs.
# deliberate: --vram-gb 26 — small measured 24.93 GB at this corner WITHOUT checkpointing, and the encoder
#             activations it removes are the dominant term in that figure, so base with it on is expected
#             well below. 26 is named because it is the cap that leaves the driver its room on a 31.84 GB
#             card; a cap set higher PERMITS PCIe paging, which reads as 100% utilisation at a quarter of
#             the power budget rather than as a crash. Diagnose by img/s, never by utilisation.
#
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.

extends = ["_family.toml"]

[data]
image_size = 336
band_high = 0.9
band_low = 0.1
slices = 20

[encoder]
backbone_lr = 4e-05
variant = "base"

[model]
slice_pooling = "labelwise"

[optim]
epochs = 12

[run]
vram_gb = 26.0

[targets]
calibrated_targets = true
hold_annotations = true

[meta]
hypothesis = "base_labelwise_dense336.sh — the validated trunk at the corner we actually ship at."
bead = "knee-olsf8"
status = "queued"
out = "base_labelwise_dense336_s2026"
