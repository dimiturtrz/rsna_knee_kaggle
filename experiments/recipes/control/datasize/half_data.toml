# bead: knee-xqyu
# half_data.sh — is this project's score DATA-limited? The question 107 arms never asked.
#
# WHY THIS AND NOT ANOTHER RECIPE TWEAK. Every axis this repository has measured is now saturated, and
# that pattern is itself the finding. The slice-AGGREGATION stage is closed from three directions (20
# cached slices against 12: -0.0001; nine slots and 83,297 unseen slices: +0.0002; four combining
# operators spanning 0.0019 total). The ENSEMBLE stage is capped at about one board tick a seat, with a
# 119-checkpoint sweep showing every working member ordering the studies 0.87-0.92 alike. UNFREEZE DEPTH
# is flat past six blocks (four is -0.0137, twelve is +0.0008). All four CoPAS components priced out on
# our own data. A volume-pretrained trunk ties frozen. knee-jk3's nine axes all landed inside 0.0062.
#
# When every lever reads flat, the limit is not on any of them, and the one quantity nobody has varied
# is HOW MUCH DATA THERE IS. `attend_true`'s close already names the suspect in words — "the limit is
# upstream, in what one slice's feature vector contains" — and every arm in the ledger shows the same
# shape underneath: peak at epoch 5-9, then decline while the training loss keeps falling. `aug_long`
# is the sharpest evidence that this decline is not the ordinary kind: the intensity regulariser
# demonstrably FIRED (train loss higher at every epoch past 4) and the peak-to-finish decline did not
# move at all, -0.0169 against the control's -0.0182. Whatever is being memorised, perturbing the input
# does not stop it.
#
# THE MEASUREMENT, and why it costs ONE run rather than three. A scaling curve needs at least two
# points and the 100% point already exists: `band_dense` = 0.8578 at epoch 8, the best single member
# this project has, fitted on exactly this recipe and scored on exactly this holdout. So this arm runs
# the SAME recipe on HALF the training studies and is read straight against that ledger row.
#
# WHAT MAKES THE TWO COMPARABLE, which is the whole design. `--train-fraction` cuts the TRAINING side
# only; the fold, the split seed and therefore the 909-study holdout are untouched. That is why it is a
# separate flag from `--studies`, which cuts both halves so that a smoke still exercises the scoring
# half of the loop. The kept studies are drawn at RANDOM (seeded by --split-seed, not --seed) rather
# than sliced off the front, because the corpus order is the one ReportFolds assigned and a prefix is a
# systematically chosen half — a difference from a prefix could be a property of that half rather than
# of its size.
#
# COST, priced before it runs. band_dense is 361 s an epoch over 4,407 studies at 20 slices; half the
# studies is about 180 s, so 12 epochs is ~36 min of card. Against: it does not raise the score by
# itself, and buys nothing directly. It is an INSTRUMENT and is justified as one — it decides which
# family every remaining hour goes to, at a point where the alternative is spending those hours on an
# axis chosen by momentum. Both of its branches are actionable, which is the bar an instrument has to
# clear.
#
# READ IT ON, against band_dense = 0.8578 on the same holdout:
#   * WITHIN the 0.0062 floor — halving the data costs nothing, so we are far out on the flat of the
#     curve and MORE data is not the lever. That is the branch that LICENSES the expensive
#     representation work currently unjustifiable on its own: a fine-tuned volume-pretrained trunk
#     (knee-jucq's surviving clause) and a larger encoder both become the honest next spend, and
#     knee-ombx's licence question drops in priority rather than blocking.
#   * BELOW by MORE than the floor, and the size is the reading rather than the sign — a fit on half
#     the data is expected to be somewhat worse, so this branch only informs if the drop is LARGE. A
#     drop of order 0.02+ says we are still on the steep part, data is the binding constraint, and
#     knee-ombx (does the winning weights inherit MRNet's non-commercial clause?) stops being a
#     backlog item and becomes the decision that gates the schedule.
#   * ABOVE the control — not expected, and it would be a statement about the HARNESS rather than
#     about data: less data fitting better means the extra studies are actively hurting, which points
#     at label noise or a corrupted subset, and the next step would be to find that subset rather than
#     to celebrate. Do not ship anything on this branch without finding the cause.
#
# WHAT IT WILL NOT SETTLE, named in advance. One point is not a curve: it separates "flat" from
# "steep" and cannot say where the knee is. If the reading is BELOW, a 25% point prices the slope
# properly and costs another ~18 min; that is a decision for after this number exists, not a plan.
#
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.
# control  band_dense = 0.8578 (declared 2026-09-03 from this header own prose, knee-sgzgc)

