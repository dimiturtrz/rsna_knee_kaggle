# foreign_mix: 3 arms moved from experiments/arms (Phase B, knee-ij7lk.1).

extends = []

[data]
band_high = 0.9
band_low = 0.1
slices = 20

[encoder]
backbone_lr = 4e-05
recompute_activations = true
whole_stack = true

[model]
slice_pooling = "max"

[optim]
epochs = 12
one_cycle = true

[targets]
weight_floor = true

[teacher]
teacher_targets = "$PROCESSED/teacher_foreign_corpus.npz"
