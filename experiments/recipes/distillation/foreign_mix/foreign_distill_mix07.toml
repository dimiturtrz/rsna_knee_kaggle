# foreign_distill_mix07.sh — invert the mix the diagnosis blamed: teacher 0.7, labels 0.3.
#
# WHAT THE DIAGNOSIS SAID, AND WHY IT NAMES THIS ARM. `foreign_distill` (teacher 0.3) read solo 0.8595,
# flat against the no-teacher control `band_dense` 0.8578, and seated NEGATIVE at every weight on both
# rulers. The nearest column said why: the student's js divergence from our pool FELL to 0.0190 where the
# no-teacher control sits at 0.0273 — the foreign teacher made the student MORE like us, not less. The
# mechanism offered for that is the mix itself: at 0.3 the label term holds 0.7 of the loss, and our
# labels are what our pool is already fitted to, so the ordering that survives training is ours.
#
# That mechanism is a claim about the WEIGHT, and it has a direct test: invert it. If 0.7 does not move
# the divergence, the mix was never the reason and no non-seating use of a foreign teacher survives; if
# it does, the axis re-opens on the operating point rather than on the teacher.
#
# ONE VARIABLE against `foreign_distill`: --distill-weight, 0.3 -> 0.7. Teacher file, rate, slices, band,
# pooling, whole-stack and epochs all held, which makes `foreign_distill` the matched control.
#
# HOW IT IS READ, written before the number. The reading is the NEAREST column, not the solo — the solo
# is expected to fall, because 0.7 of the loss is now an ordering built by weights that never saw our
# label table.
#   * js divergence UP past the roster's own boundary (0.0147 -> DISTINCT) — the mix was the knob, the
#     student is finally carrying family structure, and the seat is the next reading.
#   * js FLAT or DOWN again — the teacher cannot carry family structure into a student at ANY mix, and
#     every non-seating use of a foreign teacher is closed. With `foreign_distill` and `dissent_seat`
#     that is three arms on one axis, which is a closure rather than a null.
#   * solo below ~0.83 with js up — the term is fighting the labels rather than re-weighting them, and
#     the reading is about 0.7 being too large, not about the axis.
#
# COST. ~70 min of card, 12 epochs on the shared recipe. ZERO submission slots. Teacher file on disk.
#
# deliberate: --distill-weight (0.7, the single moving variable)
# deliberate: --teacher-targets (theirs, HELD from foreign_distill)
# bead: knee-bq62a
# reading: foreign_distill_mix07_s2026.holdout.npz
# control  foreign_distill = 0.8595 solo / js 0.0190, band_dense = 0.8578 solo / js 0.0273.
#
# ARM_LIB is set when this arm runs from a snapshot copy (see run_snapshot); $0 moves, the lib does not.

extends = ["_family.toml"]

[targets]
rank_weight = 1.0

[teacher]
distill_weight = 0.7

[meta]
hypothesis = "foreign_distill_mix07.sh — invert the mix the diagnosis blamed: teacher 0.7, labels 0.3."
bead = "knee-bq62a"
requires = ["$PROCESSED/teacher_foreign_corpus.npz"]
status = "queued"
out = "foreign_distill_mix07_s2026"
