[project]
name = "kneemri"
version = "0.1.0"
# 3.12 is the floor because strict typing needs `typing.override` (3.12+), and the alternatives were worse:
# disabling missing-override-decorator weakens the type story, and typing_extensions adds a runtime dep to
# every consumer for one decorator. No consumer needed 3.11 — synthscape already requires >=3.12 (isaacsim),
# and the other two had merely inherited this default (bd 166).
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "jaxtyping",   # Float[Tensor,"B C H W"] shape/dtype annotations — inert at runtime without a checker (no prod cost)
    "beartype",    # the runtime checker jaxtyping delegates to; wrap as @shapecheck in your types module (see devtools/README)
    "pydantic>=2",
    "pyyaml",      # paths.yaml — the one machine-local config (core/paths.py)
    # The encoder and head (kneemri/model.py). CUDA build comes from the PyTorch index below, not PyPI
    # (which is CPU-only): the local GPU is an RTX 5090 (sm_120) and needs cu128. Kaggle's own image
    # ships torch 2.10.0+cu128 with sm_75 in its arch list, measured by comp/kernels/kneemri-probe.
    "torch>=2.10",
    # torch.compile's inductor backend needs Triton, which upstream does not ship for Windows — so
    # `--compile-encoder` failed with `InductorError: TritonMissing` at the first backward, on every
    # run, since the day the flag was added. triton-windows is the maintained community build and it
    # works here: a compiled forward+backward with dynamic shapes runs on this card. Windows-only
    # because every other platform gets Triton with torch itself, and the Kaggle kernel must not try
    # to install it.
    "triton-windows; sys_platform == 'win32'",
    # DICOM ingest (the corpus is 819,640 .dcm files). Already present in Kaggle's image at 3.0.2, so it
    # needs no wheel in the kit — it is declared here because the LOCAL data layer imports it.
    "pydicom>=3",
    # Tables (train.csv, train_series.csv, the submission). pandas rather than polars, which the sibling
    # repos use: this code runs unchanged inside a Kaggle kernel, pandas is what that image ships, and a
    # second dataframe library in the kit buys nothing the submission path needs.
    "pandas",
    # The DINOv2 encoder is loaded through transformers' AutoModel, which is also how the published
    # members were built — same class, same weights, so a state dict transfers. Present in Kaggle's
    # image at 5.0.0, so it needs no wheel in the kit.
    "transformers",
    # The foreign members (`kneemri/inference/foreign_member.py`) are timm architectures — their own
    # checkpoints name the arch in a `arch` field and nothing else can rebuild it. Present in Kaggle's
    # image, so it needs no wheel in the kit; declared here because the local inference layer imports it.
    "timm",
    # The raptor decode (`kneemri.evaluation.raptor_feed`) resizes with cv2's INTER_AREA. It was an
    # opt-in extra while cv2 belonged only to THEIR reader; the reimplementation makes it ours, and a
    # kit that serves that feed cannot have it optional. Present in Kaggle's image, so it needs no wheel.
    "opencv-python-headless",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
# The official Kaggle CLI. The REST scripts in comp/ use a bearer token and need none of this, but the CLI
# reads ~/.kaggle/kaggle.json and is the working path for competition/kernel READS. Declared so a bare
# `uv sync` stops silently uninstalling it. Invoke the venv entrypoint (.venv/Scripts/kaggle.exe) by path.
submit = ["kaggle"]
# Serving a FOREIGN checkpoint through its own decode (`kneemri.evaluation.foreign_member`). Their
# published reader opens with `import pydicom, cv2`, and the absence of cv2 is invisible until
# `_make_reader()` is called, i.e. after the model and the DICOM tree are already loaded. Both are now
# runtime dependencies because `kneemri.evaluation.raptor_feed` reimplements that decode as OUR code and
# a shipped kit cannot have its resize be optional; the extra is kept as the name to sync against.
foreign = ["opencv-python-headless"]
# The guardrail ANALYZERS are an installed package pinned by scaffold tag (not vendored source) — an engine
# update is a one-line `devtools_ref` bump on `copier update`, no source diff in your PRs. Imports as
# `devtools` (`python -m devtools.graph.fitness …`); grimp/networkx arrive transitively. ast-grep/jscpd configs are
# located from the install via `python -m devtools.tools.config`. Pin lives in .copier-answers.yml (devtools_ref).
devtools = ["sdlc-devtools @ git+https://github.com/dimiturtrz/sdlc-scaffold.git@v1.28.0#subdirectory=sdlc-devtools"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "kneemri*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
# REQUIRED by [tool.structure] test_layout = "mirror". pytest collects `test_*.py` by default, so a
# mirror tree is not collected AT ALL without this — and an uncollected suite reports green while running
# zero tests, which is worse than a red one. `devtools.hygiene.mirror --assert` fails on the CONFIG if these two
# settings ever disagree, so the failure mode cannot hide. Switch both together, or neither.
python_files = ["*.py"]
# The convention is `test_<method>` FUNCTIONS (docs/UNIT_TESTS.md) — there are no test classes. Left at the
# default, pytest tries to collect any imported `Test*` PRODUCTION class as a test and warns on every run.
python_classes = []

# Dependency hygiene (deptry, ENFORCED): imported-but-undeclared (DEP001) / declared-but-unused (DEP002) /
# transitive (DEP003) imports. noxfile.py imports the `nox` runner (invoked via uvx, deliberately not a
# project dep) so it's excluded from the scan.
[tool.deptry]
# `comp/` holds deploy scripts + Kaggle kernels: they import sibling modules (`survey`) resolved by
# `sys.path[0]` in the deploy runtime, and the MOUNTED kit inside a kernel — neither is a project dep.
extend_exclude = ["noxfile.py", "comp"]

# deptry does not scan tests/ (its default exclude), so DEP002 (declared-but-unused) fires for anything
# only exercised by the test suite or by tooling. PERMANENT ignores (never imported in scanned source by
# design): the test-runner deps `pytest`/`pytest-cov`, and `sdlc-devtools` (the analyzers, invoked as a CLI
# `python -m devtools.*`). STARTERS: the runtime deps the scaffold ships for you to build on
# (numpy/jaxtyping/beartype/pydantic) — they read as unused until you import them.
[tool.deptry.per_rule_ignores]
# >>> LOCAL-SLOT: deptry-unused — PRUNE a starter once you wire it (keep pytest/pytest-cov/sdlc-devtools)
# `triton-windows` is never imported by us: it is the backend torch.compile's inductor loads at the
# first backward, and its absence is why --compile-encoder failed here on every run it was ever given.
DEP002 = [
    "pytest",
    "pytest-cov",
    "sdlc-devtools",
    "numpy",
    "jaxtyping",
    "beartype",
    "pydantic",
    "kaggle",
    "triton-windows",
]
# <<< LOCAL-SLOT: deptry-unused

[tool.ruff]
line-length = 120
# >>> LOCAL-SLOT: ruff-exclude — edit freely, the template will not overwrite intent here
extend-exclude = ["docs", "learning", "research", "interpretations"]
# <<< LOCAL-SLOT: ruff-exclude

[tool.ruff.lint]
select = ["F", "B", "I", "T201", "FBT", "BLE001", "S101", "S110", "C901", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLC0415", "RUF100", "N", "E741", "E742", "E743", "PLR0124", "PLR1714", "PLW3301", "RUF012", "RUF005", "RUF007", "RUF010", "RUF022", "RUF046", "C408", "C420", "SIM", "PERF401", "PLW0108", "E731", "E402", "ICN001", "S603", "S607", "PTH123", "E501", "SLF001", "PGH003", "PGH004", "TID251"]
ignore = [
    # jaxtyping shape strings are deliberate runtime-checked annotations that ruff's forward-ref parser
    # misreads (jaxtyping's own FAQ prescribes disabling both): F722 = a multi-token dim string
    # `Float[Tensor, "b c h w"]` (invalid forward-ref syntax); F821 = a single-axis `Float[Tensor, "n"]`
    # (a valid forward-ref to the undefined name `n`). Needed so a 1-D shape passes the now-blocking
    # shape-contracts gate (bd kqk) — the shape gate REQUIRES an annotation the lint would otherwise reject.
    "F722",
    "F821",
]

# pep8-naming (N): case convention is a UNIVERSAL rule; the allowlisted idioms are per-repo FACTS. Every
# name that carries a meaning renames — only symbols with no honest descriptive form belong here (a dodge
# makes the gate useless).
[tool.ruff.lint.pep8-naming]
# >>> LOCAL-SLOT: pep8-naming — ignore-names VOCAB (this repo's ML/physics idioms); the block is shared,
# only its contents differ. Add domain symbols (MRI T1/T2/TR/PD, canonical lib aliases…) here.
ignore-names = ["X*", "Y*", "B", "C", "H", "W", "F"]
# <<< LOCAL-SLOT: pep8-naming

[tool.ruff.lint.per-file-ignores]
# Tests get a wider carve-out: literal fixtures (PLR2004) + bool flags (FBT); mock classes mirror external
# PascalCase APIs + local math/alias scratch (N8xx); fixtures take many params (PLR0913). The SUBSTANTIVE
# gates (imports-at-top, real bugs, dead code) still apply to tests. SLF001 is enforced house-wide again
# (bd 8ex reopened) but tests legitimately poke privates-under-test, so it sits in the tests carve-out.
"__init__.py" = ["F401"]
"tests/**" = ["S101", "PLR2004", "FBT", "SLF001", "N801", "N802", "N803", "N806", "N812", "PLR0913"]
# >>> LOCAL-SLOT: per-file-ignores — repo-specific file carve-outs (e.g. a best-effort telemetry shell
# that must never raise). Add lines here; copier update won't overwrite this region.
# <<< LOCAL-SLOT: per-file-ignores

# Static type gate (pyrefly, ENFORCED): every def carries annotations (a bare param fails
# implicit-any-parameter) AND the annotations must CHECK (a mismatch fails bad-return / bad-argument-type)
# — the R1 type-grade Correctness leg ruff's lint codes can't reach. `preset = "strict"` bundles
# strict-callable-subtyping + implicit-any + missing-override + unused-ignore. Runs env-aware
# (`uv run --with pyrefly`) so it reads installed dep stubs (pydantic/numpy ship py.typed). A fresh gen's
# seed is fully typed (0 errors), so it BLOCKS from day one as a regression guard — no advisory ratchet.
# `Any` is an annotation that opts OUT of annotation, in a repo where typing is a blocking rule. Banning the
# IMPORT is what makes this complete: `dict[str, Any]` is caught by no use-site rule (not even ANN401), yet
# it cannot exist once the name cannot be imported. The unnamed escape hatch — a bare `dict`, an empty
# container, an unannotated param — is already closed by pyrefly strict's implicit-any family, so the two
# compose into one rule with no hole. At a genuine JSON boundary, name the shape with a TypedDict/Protocol.
# ADVISORY for now: it rides ruff_advisory_select until a real tree is clean (bd lph).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Any opts out of the type system. Name the real type, or a TypedDict/Protocol at a JSON boundary." }

[tool.pyrefly]
preset = "strict"
check-unannotated-defs = true
search-path = ["."]
# MUST equal the `requires-python` floor above. pyrefly does NOT infer it from requires-python — left
# unset it checks against its own default (>=3.12), so a repo declaring 3.11 would get a GREEN type check
# for `from typing import override` and then ImportError at runtime on the version it claims to support.
# The checker has to target the oldest interpreter the project promises, not the newest one it is run on.
# A unit test pins these two together (bd 166).
python-version = "3.12"
# Untyped third-party imports ERROR by default (stricter than mypy's silent Any). A dep that ships no
# py.typed / stubs goes here to be treated as Any — a per-repo FACT vocab, parallel to the deptry/vulture
# slots. jaxtyping shape strings (`Float[Array, "b n"]`) are a runtime-checked DSL
# pyrefly's front-end models only partially; if one surfaces a type error, add its module here or suppress
# at the line with `# pyrefly: ignore[<code>]`.
# >>> LOCAL-SLOT: pyrefly-ignore-imports — this repo's untyped-dependency modules (treated as Any)
ignore-missing-imports = []
# <<< LOCAL-SLOT: pyrefly-ignore-imports

# Tests inject unannotated fixture params (pytest fills them) — mirror the ruff `tests/**` carve-out so the
# strict annotation requirement doesn't force a type onto every fixture signature. Scope is packages
# (`lint_paths`) anyway, but this keeps a bare `pyrefly check` clean too.
[[tool.pyrefly.sub-config]]
matches = "**/tests/**"
check-unannotated-defs = false

[tool.vulture]
min_confidence = 60
ignore_decorators = ["@model_validator", "@field_validator", "@field_serializer", "@model_serializer", "@computed_field"]
# ignore_names = symbols vulture must treat as USED — each IS referenced, but through a path its static
# name-match can't follow (framework dispatch, iteration, string keys, external-lib attribute). NOT a
# "don't care" list — a FACT VOCAB, per-repo, parallel to the pep8-naming slot (bd fy5). `model_config`
# is the universal pydantic base (metaclass-read); add this repo's documented FPs below.
# >>> LOCAL-SLOT: vulture-ignore-names — this repo's documented dead-code false positives
ignore_names = [
  "model_config",
  # TypedDict / dataclass FIELDS, read by subscript or by `json.dumps` of the whole row — vulture sees a
  # declared key it never watches indexed. Deleting one deletes the only written record of a published
  # artefact's layout: `ids`/`pred` are OutOfFoldBlock, `oof` is PublishedPayload, `img` is MemberConfig,
  # `annot` is a Member field, and the two `vram_*` are written by RunMetrics and read back off the row.
  "ids",
  "pred",
  "oof",
  "img",
  "annot",
  "vram_peak_gb",
  "vram_alloc_gb",
  # Read from OUTSIDE the scanned packages (`paths` above is core + kneemri only): `comp/verify_members.py`
  # groups a package by `member.pixel_group`, and the Kaggle kernels under `comp/kernels/` are what
  # instantiate `KernelRun` and `KitWheels` — the whole reason those two classes exist.
  "pixel_group",
  "KernelRun",
  "KitWheels",
  # Read only by the unit gate that exists to keep a wire total. Each is a written-off or renamed set that
  # a test differences against `TrainingOptions`' fields, so a flag added without a decision fails there;
  # `unaccounted` is the same shape for the switch table. Their being unused in the package IS the design.
  "RECORDED_AS",
  "NOT_IN_CONFIG",
  "NOT_A_SWITCH",
  "unaccounted",
]
# <<< LOCAL-SLOT: vulture-ignore-names
# >>> LOCAL-SLOT: vulture-scan — edit freely, the template will not overwrite intent here
paths = ["core", "kneemri"]
exclude = []
# <<< LOCAL-SLOT: vulture-scan

[tool.coverage.run]
# >>> LOCAL-SLOT: coverage-scan — edit freely, the template will not overwrite intent here
source = ["core", "kneemri"]
# The two CLI entrypoints are driven by the corpus, not by unit tests: build_cache decodes 819,640
# DICOM files into a 35.8 GB memory map and train fits a DINOv2 for hours. Both are exercised end to
# end by the runs that produce the cache and the members, and their LOGIC lives in StudyCache and
# Trainer, which are unit-tested. Covering them here would mean asserting on an argparse call.
omit = [
    "core/data/corpus/build_cache.py",
    # The same shape for the second corpus: build_rijeka reads a 3.3 GB archive and its logic is
    # RijekaCorpus, which is unit-tested. What is left here is argparse plus the one guard that refuses
    # a scheme which would write over our own arrays — and that guard is a parser.error, not a branch.
    "core/data/corpus/build_rijeka.py",
    # And the same again for MRNet: build_mrnet reads a 5.7 GB archive and its logic is MRNetCorpus.
    "core/data/corpus/build_mrnet.py",
    # And the third: build_merged is argparse plus the guard that refuses the destination as a source.
    # Its logic is MergedCache and StudyCache.under, both unit-tested.
    "core/data/corpus/build_merged.py",
    "kneemri/kaggle/package_members.py",
    "core/data/corpus/diagnose_laterality.py",
    # train.py is now NOTHING but that entrypoint: its flags live in options.py and what they build in
    # run_setup.py, both unit-tested, and `main` itself is walked end to end by argv_to_checkpoint.
    "kneemri/training/train.py",
]
# <<< LOCAL-SLOT: coverage-scan

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    "@(abc\\.)?abstractmethod",
    # A module's `def main()` is argparse wiring over a corpus-driven run: it resolves paths, loads a
    # 35.8 GB memory map, fits or scores a model. `omit` already exempts the modules that are NOTHING
    # but a CLI; this covers the ones that are a tested class PLUS an entrypoint (train, attribution,
    # ruler_check, report_embeddings), where omitting the whole file would hide the class too.
    # THE RULE THIS ASSUMES: a main() holds no logic worth testing. Logic goes in a class - which is
    # the project's design anyway (config objects, strategy over dispatch). If a main() ever needs a
    # test, that is the signal it has grown something that belongs in a class instead.
    "^def main\\(\\) -> None:$",
]


# Directional layer gate (import-linter): forbidden-import CONTRACTS graph.py can't express — a one-way
# `core -> trainer` import is no cycle, so it passes the graph gate but must fail here. The gate is
# universal (all house repos run it); the SCOPE + contracts are project-local, hence the slot.
# >>> LOCAL-SLOT: import-contracts — layering scope + your directional rules. `root_packages` is the set
# import-linter analyses (defaults to `packages`; widen it if a scope-only package such as a viewer carries
# layer rules but isn't in the arch set). Ships the kernel-independence starter (the FIRST package imports
# none of the others), the pattern all 3 house repos share. Add viewer/trainer or domain contracts below;
# edit freely — copier update won't overwrite this region.
[tool.importlinter]
root_packages = ["core", "kneemri"]

[[tool.importlinter.contracts]]
name = "core is an independent kernel (imports none of the other packages)"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["kneemri"]

# The subject packages, and the direction each may face. Only what the code ALREADY obeys is written
# here — a contract stating an aspiration fails on the day it lands and gets deleted, so the ones we
# do not yet obey (inference <-> evaluation, labels reaching up into both) are beads, not entries.
#
# The data layer (corpus, labels, findings) lives under `core`, so EVERY "it must not reach up into
# the pipeline" rule for it is already the kernel contract above — one line covering the whole layer
# instead of a hand-kept list per package that had to grow with each new kneemri subpackage. What is
# left below is only what the kernel contract cannot say: the ordering WITHIN the data layer, and the
# rules whose source is a kneemri package.

[[tool.importlinter.contracts]]
name = "corpus is the base layer (pixels and studies know nothing of what labels them)"
type = "forbidden"
source_modules = ["core.data.corpus"]
forbidden_modules = ["core.data.labels"]

[[tool.importlinter.contracts]]
name = "models sit on corpus alone (a network reads pixels; it does not score, fit or submit)"
type = "forbidden"
source_modules = ["kneemri.models"]
forbidden_modules = [
    "kneemri.embeddings",
    "core.data.labels",
    "kneemri.training",
    "kneemri.inference",
    "kneemri.evaluation",
    "kneemri.kaggle",
]

[[tool.importlinter.contracts]]
name = "embeddings are a cache over corpus and models, not a consumer of what is fitted on them"
type = "forbidden"
source_modules = ["kneemri.embeddings"]
forbidden_modules = [
    "core.data.labels",
    "kneemri.training",
    "kneemri.inference",
    "kneemri.evaluation",
    "kneemri.kaggle",
]

[[tool.importlinter.contracts]]
name = "a run's records sit on corpus and models alone (what produced them never comes back in)"
type = "forbidden"
source_modules = ["kneemri.runs"]
forbidden_modules = [
    "kneemri.embeddings",
    "core.data.labels",
    "kneemri.training",
    "kneemri.inference",
    "kneemri.evaluation",
    "kneemri.kaggle",
]

[[tool.importlinter.contracts]]
name = "inference serves; it never imports the layer that scores it"
type = "forbidden"
source_modules = ["kneemri.inference"]
forbidden_modules = ["kneemri.evaluation", "kneemri.training"]

[[tool.importlinter.contracts]]
name = "evaluation measures predictions; the queue's own preflights live in experiments"
type = "forbidden"
source_modules = ["kneemri.evaluation"]
forbidden_modules = ["kneemri.training", "kneemri.experiments", "kneemri.kaggle"]

[[tool.importlinter.contracts]]
name = "experiments is a top layer with kaggle: nothing in the pipeline imports its preflights"
type = "forbidden"
source_modules = [
    "kneemri.models",
    "kneemri.embeddings",
    "kneemri.runs",
    "kneemri.training",
    "kneemri.inference",
    "kneemri.evaluation",
    "kneemri.kaggle",
]
forbidden_modules = ["kneemri.experiments"]

[[tool.importlinter.contracts]]
name = "kaggle is the top: nothing below it may import the submission layer"
type = "forbidden"
source_modules = [
    "kneemri.models",
    "kneemri.embeddings",
    "kneemri.runs",
    "kneemri.training",
    "kneemri.inference",
    "kneemri.evaluation",
]
forbidden_modules = ["kneemri.kaggle"]

[[tool.importlinter.contracts]]
name = "training is fitting only — serving and packaging never import it"
type = "forbidden"
source_modules = ["kneemri.inference", "kneemri.kaggle"]
forbidden_modules = ["kneemri.training"]
# <<< LOCAL-SLOT: import-contracts


# Forbidden-USE contracts (devtools/contracts.py) — directional rules over the DECOMPOSED arrows
# (inherits / holds / references / calls / construct), not just imports. import-linter can only say "must
# not IMPORT"; this says "must not USE", and can target ONE kind — e.g. "nothing outside the composition
# root may CONSTRUCT a concrete", which an import rule cannot express at all. Empty by default: no
# contracts means nothing to check, so a fresh project starts green and ratchets. The GATE is universal;
# the LAYERS are a per-repo FACT, hence the slot.
# >>> LOCAL-SLOT: arch-contracts — this repo's directional use rules (uncomment + edit)
# [[tool.arch.forbidden]]
# name = "domain must not use infra"
# source = "core.domain"
# forbidden = ["core.infra"]
# kinds = ["calls", "holds", "construct"]   # omit `kinds` to forbid EVERY arrow kind
# <<< LOCAL-SLOT: arch-contracts

# Architecture fitness thresholds read by devtools/graph.py --assert.
[tool.structure]
# >>> LOCAL-SLOT: arch-thresholds — tune per repo; the template ships defaults and won't churn these,
# so a per-project override survives `copier update` without a merge conflict.
bottleneck_degree = 8    # fan-in AND fan-out both over this = god-module
file_max = 750           # god-file line ceiling — raise as real files grow
file_min = 0             # advisory line floor — 0 = OFF (no honest universal floor; raise per repo if wanted)
betweenness_max = 0.10   # advisory chokepoint threshold
main_sequence_max = 0.0  # advisory Martin main-sequence distance |A+I-1| ceiling — 0 = OFF (a concrete
                         # stable leaf legitimately sits at D≈1, so no honest universal floor; raise per repo)
feature_envy_min = 4     # feature-envy floor: foreign accesses before a method is judged at all. Below
                         # it the ratio is noise (2 vs 1 proves nothing). Raise it for repos full of
                         # legitimate delegators (mappers / serializers / visitors) rather than weakening
                         # the rule; value objects are already excluded by role.
demeter_max_depth = 2    # Law of Demeter ceiling: attribute hops in one chain. 2 = "reach your own field,
                         # then talk to it" (`self.store.get(k)`); 3 reaches THROUGH it
                         # (`self.store.config.name`). Raise it for data-navigation-heavy trees (AST/JSON
                         # walking), where a deep chain is reading a structure, not coupling to a stranger.
test_layout = "mirror"   # WHERE a module's unit test lives — read by BOTH mirror gates (file-level, in
                         # devtools/graph.py, and method-level, in devtools/mirror.py), so they cannot
                         # disagree about what is covered. See docs/UNIT_TESTS.md.
                         #   "mirror" tests/unit/<pkg>/<path>/<name>.py — a PATH mirror, so the names match
                         #            and what a test covers is visible in its path rather than
                         #            reconstructed by the reader. REQUIRES python_files = ["*.py"] (set
                         #            above): `test_` is how pytest FINDS files, not a convention, and
                         #            without that setting nothing is collected at all.
                         #   "off"    no test-existence gate, and no method-level gate either
                         # There is deliberately no lenient value. A mode accepting a test "anywhere" is not
                         # a threshold, it is the RULE meaning something else here — see the o70 union law
                         # in the scaffold's docs/RULE_INVENTORY.md. Turn it off or meet it.
