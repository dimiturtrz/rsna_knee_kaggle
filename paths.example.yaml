# Copy to paths.yaml (gitignored — machine-specific absolute paths).
#   cp paths.example.yaml paths.yaml   # then set the one path below
#
# ONE data root. Everything else is derived:
#   <data>/raw/rsna_knee_abnormality/   the competition download, unzipped and never written to
#   <data>/processed/rsna_knee_abnormality/   slice cache, folds, weights — created automatically
#
# Env KNEEMRI_DATA overrides this file (CI points it at an empty dir so data-gated tests skip).
data: /path/to/data/volumetric/mri

# OPTIONAL per-kind override. A top-level key named for a kind redirects that kind ALONE, so the
# cache can live on a fast scratch disk while the download stays on the slow one. Unset kinds stay
# at <data>/<kind>.
#
# processed: /fast/scratch/processed
#
# A Windows drive path is translated to its WSL mount (and back) automatically; a path that cannot be
# translated to this machine RAISES rather than becoming a silently relative directory.
